    <script>
      const params = new URLSearchParams(window.location.search);
      const stationId = params.get("id");
      const fuel = (params.get("fuel") || "diesel").toLowerCase();
      const name = params.get("name") || "Tankstelle";
      const lat = params.get("lat");
      const lng = params.get("lng");
      const APP_TIME_ZONE = "Europe/Berlin";
      const DATA_BASE = "data2/";
      const HISTORY_START = "2026-04-01";
      let chartInstance = null;
      let heatmapInstances = [];
      let locationHeatmapInstance = null;
      let stationHeatmapInstance = null;
      let heatmapSummary = null;
      let stationCatalog = null;

        requestedView === "profile" || requestedView === "heatmap"
          ? requestedView
          : "history";
      const DARK_MODE_MEDIA_QUERY = window.matchMedia(
        "(prefers-color-scheme: dark)",
      );
      const PRIOR_DAY_COLOR = {
        fill: "rgba(107, 114, 128, 0.2)",
        stroke: "#6b7280",
      };
      const SAME_DAY_COLOR = {
        fill: "rgba(37, 99, 235, 0.2)",
        stroke: "#2563eb",
      };
      const HISTORY_COLOR = {
        stroke: "#0f766e",
        fill: "rgba(15, 118, 110, 0.16)",
      };
      const HEATMAP_LOW_COLOR = "#0f766e";
      const HEATMAP_MID_COLOR = "#f59e0b";
      const HEATMAP_HIGH_COLOR = "#b91c1c";
      const HEATMAP_WEEKDAY_LABELS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
      const HEATMAP_WEEKDAY_FULL_LABELS = [
        "Montag",
        "Dienstag",
        "Mittwoch",
        "Donnerstag",
        "Freitag",
        "Samstag",
        "Sonntag",
      ];
      const HEATMAP_DETAIL_HINT =
        "Hinweis: Klicke auf einen Tag in der Heatmap, um den detaillierten Preisvergleich der Tankstellen für diesen Tag einzublenden.";

      function currentChartTheme() {
        if (DARK_MODE_MEDIA_QUERY.matches) {
          return {
            axisLabel: "rgba(237, 244, 243, 0.82)",
            axisTitle: "rgba(237, 244, 243, 0.92)",
            grid: "rgba(148, 163, 184, 0.18)",
            border: "rgba(148, 163, 184, 0.3)",
            tooltipBackground: "rgba(9, 14, 17, 0.96)",
            tooltipBorder: "rgba(126, 165, 158, 0.2)",
            tooltipText: "#edf4f3",
          };
        }
        return {
          axisLabel: "rgba(17, 24, 39, 0.72)",
          axisTitle: "rgba(17, 24, 39, 0.88)",
          grid: "rgba(0, 0, 0, 0.08)",
          border: "rgba(17, 24, 39, 0.16)",
          tooltipBackground: "rgba(255, 255, 255, 0.96)",
          tooltipBorder: "rgba(15, 23, 42, 0.1)",
          tooltipText: "#111827",
        };
      }

      function applyChartTheme(options) {
        const theme = currentChartTheme();
        const themedOptions = {
          ...options,
          scales: {
            ...(options.scales || {}),
          },
          plugins: {
            ...(options.plugins || {}),
          },
        };
        ["x", "y"].forEach((axisKey) => {
          const axis = themedOptions.scales?.[axisKey];
          if (!axis) return;
          themedOptions.scales[axisKey] = {
            ...axis,
            ticks: {
              ...(axis.ticks || {}),
              color: theme.axisLabel,
            },
            title: axis.title
              ? {
                  ...axis.title,
                  color: theme.axisTitle,
                }
              : axis.title,
            grid: {
              ...(axis.grid || {}),
              color:
                axis.grid && Object.prototype.hasOwnProperty.call(axis.grid, "color")
                  ? axis.grid.color
                  : theme.grid,
            },
            border: {
              ...(axis.border || {}),
              color: theme.border,
            },
          };
        });
        if (themedOptions.plugins.legend !== false) {
          themedOptions.plugins.legend = {
            ...(themedOptions.plugins.legend || {}),
            labels: {
              ...((themedOptions.plugins.legend || {}).labels || {}),
              color: theme.axisLabel,
            },
          };
        }
        themedOptions.plugins.tooltip = {
          ...(themedOptions.plugins.tooltip || {}),
          backgroundColor: theme.tooltipBackground,
          borderColor: theme.tooltipBorder,
          borderWidth: 1,
          titleColor: theme.tooltipText,
          bodyColor: theme.tooltipText,
          footerColor: theme.tooltipText,
        };
        return themedOptions;
      }

      function refreshChartTheme() {
        if (!chartInstance) return;
        chartInstance.options = applyChartTheme(chartInstance.options || {});
        chartInstance.update();
      }

      const noonDividerPlugin = {
        id: "noonDivider",
        afterDatasetsDraw(chart, _args, options) {
          if (!options || options.enabled === false) return;
          const xScale = chart.scales?.x;
          const yScale = chart.scales?.y;
          const chartArea = chart.chartArea;
          const labels = chart.data?.labels;
          if (
            !xScale ||
            !yScale ||
            !chartArea ||
            !Array.isArray(labels) ||
            labels.length < 13
          ) {
            return;
          }
          const dividerX = xScale.getPixelForValue(12);
          const { ctx } = chart;
          ctx.save();
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = "rgba(37, 99, 235, 0.38)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(dividerX, chartArea.top);
          ctx.lineTo(dividerX, chartArea.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(37, 99, 235, 0.82)";
          ctx.font = "12px Manrope, sans-serif";
          ctx.fillText("12:00", dividerX + 6, chartArea.top + 14);
          const noonValue = Number(options.noonValue);
          const preNoonValue = Number(options.preNoonValue);
          const noonY = yScale.getPixelForValue(noonValue);
          const preNoonY = yScale.getPixelForValue(preNoonValue);
          if (
            Number.isFinite(noonValue) &&
            noonY >= chartArea.top &&
            noonY <= chartArea.bottom &&
            Number.isFinite(preNoonValue) &&
            preNoonY >= chartArea.top &&
            preNoonY <= chartArea.bottom
          ) {
            const connectorX = dividerX + 1.5;
            const label = `${formatSignedRelativeLabel(noonValue)} zum Vortag`;
            const labelMidValue = (preNoonValue + noonValue) / 2 + 0.005;
            const labelY = Math.max(
              chartArea.top + 10,
              Math.min(chartArea.bottom - 10, yScale.getPixelForValue(labelMidValue)),
            );
            ctx.strokeStyle = "rgba(37, 99, 235, 0.74)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(connectorX, preNoonY);
            ctx.lineTo(connectorX, noonY);
            ctx.stroke();
            ctx.fillStyle = "rgba(37, 99, 235, 0.88)";
            ctx.beginPath();
            ctx.arc(connectorX, preNoonY, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(connectorX, noonY, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = "600 12px Manrope, sans-serif";
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.96)";
            ctx.lineWidth = 4;
            ctx.strokeText(label, dividerX - 8, labelY);
            ctx.fillText(label, dividerX - 8, labelY);
          }
          ctx.restore();
        },
      };
      const midnightDividerPlugin = {
        id: "midnightDivider",
        afterDatasetsDraw(chart, _args, options) {
          if (!options || options.enabled === false) return;
          const xScale = chart.scales?.x;
          const chartArea = chart.chartArea;
          if (!xScale || !chartArea || !Number.isFinite(Number(options.markerIndex))) {
            return;
          }
          const dividerX = xScale.getPixelForValue(Number(options.markerIndex));
          const { ctx } = chart;
          ctx.save();
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = "rgba(37, 99, 235, 0.38)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(dividerX, chartArea.top);
          ctx.lineTo(dividerX, chartArea.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(37, 99, 235, 0.82)";
          ctx.font = "12px Manrope, sans-serif";
          ctx.fillText("00:00", dividerX + 6, chartArea.top + 14);
          ctx.restore();
        },
      };
      const historyButton = document.getElementById("history-view");
      const heatmapButton = document.getElementById("heatmap-view");
      const profileButton = document.getElementById("profile-view");
      const heatmapControlsEl = document.getElementById("heatmap-controls");
      const locationSelectEl = document.getElementById("location-select");
      const stationSelectEl = document.getElementById("station-select");
      const heatmapGridEl = document.getElementById("heatmap-grid");
      const locationHeatmapPanelEl = document.getElementById(
        "location-heatmap-panel",
      );
      const stationHeatmapPanelEl = document.getElementById(
        "station-heatmap-panel",
      );
      const locationHeatmapTitleEl = document.getElementById(
        "location-heatmap-title",
      );
      const stationHeatmapTitleEl = document.getElementById(
        "station-heatmap-title",
      );
      const locationHeatmapSubEl = document.getElementById("location-heatmap-sub");
      const stationHeatmapSubEl = document.getElementById("station-heatmap-sub");
      const overallHeatmapDetailEl = document.getElementById(
        "overall-heatmap-detail",

      const locationHeatmapDetailEl = document.getElementById(
        "location-heatmap-detail",
      );

      const title = `${name} · ${fuel.toUpperCase()}`;
      document.getElementById("chart-title").textContent = title;
      document.getElementById("chart-sub").textContent = "Lade Chart...";

      if (lat && lng) {
        const maps = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
        const link = document.getElementById("maps-link");
        link.href = maps;
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.json();
      }

      async function fetchCsv(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return parseCsv(await response.text());
      }

      async function loadStationCatalog() {
        if (stationCatalog) return stationCatalog;
        const rows = await fetchJson("data/stations.json");
        stationCatalog = new Map(
          rows
            .map((row) => {
              const id = String(row?.uuid || "").trim();
              if (!id) return null;
              return [
                id,
                {
                  id,
                  name: String(row?.name || "Tankstelle").trim(),
                  brand: String(row?.brand || "").trim(),
                  city: String(row?.city || "").trim(),
                  street: String(row?.street || "").trim(),
                  houseNumber: String(row?.house_number || "").trim(),
                  postCode: String(row?.post_code || "").trim(),
                },
              ];
            })
            .filter(Boolean),
        );
        return stationCatalog;
      }

      function parseCsv(text) {
        const lines = text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
        if (!lines.length) return [];
        const headers = lines[0].split(",").map((header) => header.trim());
        return lines.slice(1).map((line) => {
          const values = line.split(",");
          const row = {};
          headers.forEach((header, index) => {
            row[header] = values[index] ?? "";
          });
          return row;
        });
      }

      function stationPath(station) {
        return station.split("-").join("/");
      }

      function setButtonState() {
        historyButton.classList.toggle("primary", activeView === "history");
        heatmapButton.classList.toggle("primary", activeView === "heatmap");
        profileButton.classList.toggle("primary", activeView === "profile");
        const isHeatmap = activeView === "heatmap";
        heatmapControlsEl.hidden = !isHeatmap;
        heatmapGridEl.hidden = !isHeatmap;
        overallHeatmapDetailEl.hidden = !isHeatmap;
        if (!isHeatmap) {
          locationHeatmapPanelEl.hidden = true;
          stationHeatmapPanelEl.hidden = true;
          destroyHeatmapInstances();
        }
      }

      function updateViewInUrl() {
        params.set("view", activeView);
        const nextUrl = `${window.location.pathname}?${params.toString()}`;
        window.history.replaceState({}, "", nextUrl);
      }

      function switchView(view) {
        activeView = view;
        setButtonState();
        updateViewInUrl();
        loadChart();

      historyButton.addEventListener("click", () => switchView("history"));
      heatmapButton.addEventListener("click", () => switchView("heatmap"));
      profileButton.addEventListener("click", () => switchView("profile"));
      locationSelectEl.addEventListener("change", () => {
        handleLocationChange().catch(() => {
          locationHeatmapSubEl.textContent = "Standort-Heatmap konnte nicht geladen werden.";
        });
      });
      stationSelectEl.addEventListener("change", () => {
        handleStationChange().catch(() => {
          stationHeatmapSubEl.textContent = "Tankstellen-Heatmap konnte nicht geladen werden.";
        });
      });
      setButtonState();
      updateViewInUrl();

      function referenceMetaForHour(hour) {
        return Number(hour) < 12
          ? {
              label: "Vortag 12:00",
              period: "00:00 - 11:59",
            }
          : {
              label: "Tages-12:00",
              period: "12:00 - 23:59",
            };
      }

      function buildReferenceSubtitle() {
        return `${fuel.toUpperCase()} · Preisänderung zur jeweiligen 12:00-Referenz · Grau = 00:00-11:59 ggü. Vortag 12:00 · Blau = 12:00-23:59 ggü. Tages-12:00 · negative Werte = günstiger, positive Werte = teurer`;
      }

      function buildCycleSubtitle() {
        return `${fuel.toUpperCase()} · Preisänderung zur ausgewählten 12:00-Referenz im Zyklus 12:00 Vortag → 12:00 Tag · Erhöhungen bis 12:15 zählen noch zum Noon-Anker, spätere nicht · Mitternacht markiert die Tagesgrenze`;
      }

      function sanitizeRelativeValue(valueInEuro) {
        const amount = Number(valueInEuro);
        if (!Number.isFinite(amount)) return 0;
        return amount;
      }

      function formatRelativeChange(valueInEuro, hour) {
        const amount = sanitizeRelativeValue(valueInEuro);
        const referenceMeta = referenceMetaForHour(hour);
        if (!Number.isFinite(amount)) return "-";
        if (Math.abs(amount) < 0.0005) return `auf ${referenceMeta.label}-Niveau`;
        return `${(Math.abs(amount) * 100).toFixed(1)} ct/l ${
          amount > 0 ? "teurer" : "günstiger"
        } als ${referenceMeta.label}`;
      }

      function formatSignedRelativeLabel(valueInEuro) {
        const cents = sanitizeRelativeValue(valueInEuro) * 100;
        if (Math.abs(cents) < 0.05) return "0,0 ct/l";
        return `${cents > 0 ? "+" : "-"}${new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 1,
          maximumFractionDigits: 1,
        }).format(Math.abs(cents))} ct/l`;
      }

      function formatEuroTick(valueInEuro) {
        const amount = Number(valueInEuro);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(amount);
      }

      function formatFuelPrice(valueInEuro) {
        const amount = Number(valueInEuro);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 3,
          maximumFractionDigits: 3,
        }).format(amount);
      }

      function computeSeriesDomain(values, includeZero = false) {
        const finiteValues = values.filter((value) => Number.isFinite(value));
        if (!finiteValues.length) {
          return { min: -0.05, max: 0.05 };
        }
        let min = Math.min(...finiteValues);
        let max = Math.max(...finiteValues);
        if (includeZero) {
          min = Math.min(min, 0);
          max = Math.max(max, 0);
        }
        if (Math.abs(max - min) < 0.0005) {
          const pad = Math.max(0.01, Math.abs(max || 0.01) * 0.2);
          return { min: min - pad, max: max + pad };
        }
        const pad = Math.max(0.01, (max - min) * 0.12);
        return { min: min - pad, max: max + pad };
      }

      function referenceTooltipLines(row) {
        const referenceMeta = referenceMetaForHour(row?.hour);
        return [
          `Zeitraum: ${referenceMeta.period}`,
          `Referenz: ${referenceMeta.label}`,
        ];
      }

      function formatHistoryDay(day) {
        const [year, month, date] = String(day).split("-");
        if (!year || !month || !date) return String(day);
        return `${date}.${month}.${year}`;
      }

      function formatHistoryTick(day) {
        const [year, month, date] = String(day).split("-");
        if (!year || !month || !date) return String(day);
        return `${date}.${month}.`;
      }

      function formatLastUpdate(lastUpdate) {
        if (!lastUpdate) return null;
        const parsed = new Date(lastUpdate);
        if (Number.isNaN(parsed.getTime())) return lastUpdate;
        return new Intl.DateTimeFormat("de-DE", {
          timeZone: APP_TIME_ZONE,
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        }).format(parsed);
      }

      function parseHistoryDate(day) {
        const [year, month, date] = String(day).split("-").map(Number);
        if (!year || !month || !date) return null;
        const parsed = new Date(Date.UTC(year, month - 1, date));
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      }

      function weekdayIndexForDate(day) {
        const parsed = parseHistoryDate(day);
        if (!parsed) return null;
        return (parsed.getUTCDay() + 6) % 7;
      }

      function normalizeHistoryRows(rows) {
        return rows
          .map((row) => ({
            date: String(row.date || "").trim(),
            price: Number(row.price),
            lastUpdate: String(row.last_update || "").trim(),
          }))
          .filter(
            (row) =>
              row.date &&
              row.date >= HISTORY_START &&
              Number.isFinite(row.price),
          )
          .sort((left, right) => left.date.localeCompare(right.date));
      }

      function normalizeHeatmapRows(source, fallbackDates = []) {
        if (Array.isArray(source)) {
          return normalizeHistoryRows(source).map((row) => ({
            ...row,
            count: Number(row.count || 1),
          }));
        }
        if (Array.isArray(source?.rows)) {
          return normalizeHeatmapRows(source.rows);
        }
        const dates = Array.isArray(source?.dates) ? source.dates : fallbackDates;
        const prices = Array.isArray(source?.prices) ? source.prices : [];
        const counts = Array.isArray(source?.counts) ? source.counts : [];
        return dates
          .map((dateValue, index) => ({
            date: String(dateValue || "").trim(),
            price: Number(prices[index]),
            count: Number(counts[index] || 1),
          }))
          .filter(
            (row) =>
              row.date &&
              row.date >= HISTORY_START &&
              Number.isFinite(row.price),
          )
          .sort((left, right) => left.date.localeCompare(right.date));
      }

      function buildHeatmapSubtitle(rows, label = "Heatmap der Mittagspreise") {
        if (!rows.length) {
          return `${fuel.toUpperCase()} · Keine Heatmap-Daten ab ${formatHistoryDay(HISTORY_START)} verfügbar.`;
        }
        const first = rows[0].date;
        const last = rows[rows.length - 1].date;
        return [
          `${fuel.toUpperCase()} · ${label}`,
          `${rows.length} Tage`,
          `${formatHistoryDay(first)} - ${formatHistoryDay(last)}`,
          "Zeilen = Wochentage",
          "Spalten = Kalenderwochen",
          "Farbe = Preisniveau",
        ].join(" · ");
      }

      function buildHistorySubtitle(rows) {
        if (!rows.length) {
          return `${fuel.toUpperCase()} · Keine Mittagspreise ab ${formatHistoryDay(HISTORY_START)} verfügbar.`;
        }
        const first = rows[0].date;
        const last = rows[rows.length - 1].date;
        return [
          `${fuel.toUpperCase()} · Mittagspreise`,
          `${rows.length} Tage`,
          `${formatHistoryDay(first)} - ${formatHistoryDay(last)}`,
          "y-Achse = etablierter Mittagspreis",
        ].join(" · ");
      }

      function hexToRgb(hex) {
        const clean = String(hex).replace("#", "");
        const value = Number.parseInt(clean, 16);
        return {
          r: (value >> 16) & 255,
          g: (value >> 8) & 255,
          b: value & 255,
        };
      }

      function mixColor(left, right, ratio) {
        const a = hexToRgb(left);
        const b = hexToRgb(right);
        const t = Math.max(0, Math.min(1, ratio));
        return `rgb(${Math.round(a.r + (b.r - a.r) * t)}, ${Math.round(
          a.g + (b.g - a.g) * t,
        )}, ${Math.round(a.b + (b.b - a.b) * t)})`;
      }

      function heatmapColor(value, min, max) {
        if (!Number.isFinite(value)) return "rgba(148, 163, 184, 0.16)";
        if (Math.abs(max - min) < 0.0005) return HEATMAP_MID_COLOR;
        const ratio = (value - min) / (max - min);
        if (ratio < 0.5) {
          return mixColor(HEATMAP_LOW_COLOR, HEATMAP_MID_COLOR, ratio / 0.5);
        }
        return mixColor(HEATMAP_MID_COLOR, HEATMAP_HIGH_COLOR, (ratio - 0.5) / 0.5);
      }

      function computeHeatmapColorDomain(rowSets) {
        // One global price domain keeps the three heatmaps visually comparable.
        const values = rowSets
          .flat()
          .map((row) => Number(row.price))
          .filter(Number.isFinite);
        if (!values.length) return null;
        return {
          min: Math.min(...values),
          max: Math.max(...values),
        };
      }

      function currentHeatmapColorDomain() {
        return computeHeatmapColorDomain([
          overallHeatmapRows,
          locationHeatmapRows,
          stationHeatmapRows,
        ]);
      }

      function syncHeatmapColorDomains() {
        const domain = currentHeatmapColorDomain();
        chartInstance?.setColorDomain?.(domain);
        locationHeatmapInstance?.setColorDomain?.(domain);
        stationHeatmapInstance?.setColorDomain?.(domain);
      }

      function textColorForFill(fill) {
        const match = String(fill).match(/\d+/g);
        if (!match || match.length < 3) return "#111827";
        const [r, g, b] = match.slice(0, 3).map(Number);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luminance > 0.58 ? "#111827" : "#ffffff";
      }

      function buildHeatmapLayout(rows) {
        const datedRows = rows
          .map((row) => {
            const parsed = parseHistoryDate(row.date);
            const weekday = weekdayIndexForDate(row.date);
            return parsed && weekday !== null
              ? {
                  ...row,
                  parsed,
                  weekday,
                }
              : null;
          })
          .filter(Boolean);
        if (!datedRows.length) return null;

        const oneDayMs = 24 * 60 * 60 * 1000;
        const first = datedRows[0].parsed;
        const firstWeekStart = new Date(first.getTime());
        firstWeekStart.setUTCDate(firstWeekStart.getUTCDate() - datedRows[0].weekday);
        const firstWeekStartMs = firstWeekStart.getTime();
        const values = datedRows.map((row) => row.price);
        const cells = datedRows.map((row) => ({
          ...row,
          week: Math.floor((row.parsed.getTime() - firstWeekStartMs) / (7 * oneDayMs)),
        }));

        return {
          cells,
          columns: Math.max(...cells.map((cell) => cell.week)) + 1,
          firstWeekStart,
          min: Math.min(...values),
          max: Math.max(...values),
        };
      }

      function setupHeatmapCanvas(canvas) {
        const bounds = canvas.getBoundingClientRect();
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const width = Math.max(320, Math.round(bounds.width));
        const height = Math.max(320, Math.round(bounds.height));
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        ctx.clearRect(0, 0, width, height);
        return { ctx, width, height };
      }

      function drawHeatmapCanvas(canvas, rows, colorDomain = null) {
        const layout = buildHeatmapLayout(rows);
        const { ctx, width, height } = setupHeatmapCanvas(canvas);
        const theme = currentChartTheme();
        const margin = {
          top: 34,
          right: 22,
          bottom: 72,
          left: 48,
        };
        const plotWidth = width - margin.left - margin.right;
        const plotHeight = height - margin.top - margin.bottom;

        ctx.font = "12px Manrope, system-ui, sans-serif";
        ctx.textBaseline = "middle";
        ctx.fillStyle = theme.axisLabel;

        if (!layout || plotWidth <= 0 || plotHeight <= 0) {
          ctx.textAlign = "center";
          ctx.fillText("Keine Heatmap-Daten verfügbar.", width / 2, height / 2);
          return null;
        }

        const domain = colorDomain || {
          min: layout.min,
          max: layout.max,
        };
        const cellWidth = plotWidth / layout.columns;
        const cellHeight = plotHeight / HEATMAP_WEEKDAY_LABELS.length;
        const cellGap = Math.max(1, Math.min(3, cellWidth * 0.08, cellHeight * 0.08));
        const cellsByPosition = new Map();

        ctx.textAlign = "right";
        HEATMAP_WEEKDAY_LABELS.forEach((label, index) => {
          const y = margin.top + index * cellHeight + cellHeight / 2;
          ctx.fillStyle = theme.axisLabel;
          ctx.fillText(label, margin.left - 12, y);
        });

        ctx.strokeStyle = theme.grid;
        ctx.lineWidth = 1;
        for (let row = 0; row <= HEATMAP_WEEKDAY_LABELS.length; row += 1) {
          const y = margin.top + row * cellHeight;
          ctx.beginPath();
          ctx.moveTo(margin.left, y);
          ctx.lineTo(width - margin.right, y);
          ctx.stroke();
        }

        layout.cells.forEach((cell) => {
          const x = margin.left + cell.week * cellWidth;
          const y = margin.top + cell.weekday * cellHeight;
          const fill = heatmapColor(cell.price, domain.min, domain.max);
          const rect = {
            x: x + cellGap / 2,
            y: y + cellGap / 2,
            width: Math.max(1, cellWidth - cellGap),
            height: Math.max(1, cellHeight - cellGap),
          };
          ctx.fillStyle = fill;
          ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
          cellsByPosition.set(`${cell.week}:${cell.weekday}`, { ...cell, rect });

          if (cellWidth >= 46 && cellHeight >= 24) {
            ctx.fillStyle = textColorForFill(fill);
            ctx.textAlign = "center";
            ctx.font = "600 11px Manrope, system-ui, sans-serif";
            ctx.fillText(
              formatFuelPrice(cell.price),
              rect.x + rect.width / 2,
              rect.y + rect.height / 2,
            );
            ctx.font = "12px Manrope, system-ui, sans-serif";
          }
        });

        const labelEvery = Math.max(1, Math.ceil(layout.columns / 8));
        ctx.fillStyle = theme.axisLabel;
        ctx.textAlign = "center";
        for (let week = 0; week < layout.columns; week += 1) {
          if (week % labelEvery !== 0 && week !== layout.columns - 1) continue;
          const labelDate = new Date(layout.firstWeekStart.getTime());
          labelDate.setUTCDate(labelDate.getUTCDate() + week * 7);
          const label = formatHistoryTick(labelDate.toISOString().slice(0, 10));
          const x = margin.left + week * cellWidth + cellWidth / 2;
          ctx.fillText(label, x, margin.top + plotHeight + 18);
        }

        const legendWidth = Math.min(280, Math.max(160, plotWidth * 0.42));
        const legendHeight = 10;
        const legendX = margin.left;
        const legendY = height - 34;
        const gradient = ctx.createLinearGradient(legendX, 0, legendX + legendWidth, 0);
        gradient.addColorStop(0, HEATMAP_LOW_COLOR);
        gradient.addColorStop(0.5, HEATMAP_MID_COLOR);
        gradient.addColorStop(1, HEATMAP_HIGH_COLOR);
        ctx.fillStyle = gradient;
        ctx.fillRect(legendX, legendY, legendWidth, legendHeight);
        ctx.strokeStyle = theme.border;
        ctx.strokeRect(legendX, legendY, legendWidth, legendHeight);
        ctx.fillStyle = theme.axisLabel;
        ctx.textAlign = "left";
        ctx.fillText(`${formatFuelPrice(domain.min)} EUR/l`, legendX, legendY + 26);
        ctx.textAlign = "right";
        ctx.fillText(
          `${formatFuelPrice(domain.max)} EUR/l`,
          legendX + legendWidth,
          legendY + 26,
        );

        return {
          ...layout,
          colorDomain: domain,
          margin,
          plotWidth,
          plotHeight,
          cellWidth,
          cellHeight,
          cellsByPosition,
        };
      }

      function heatmapCellAt(layout, x, y) {
        if (!layout) return null;
        const week = Math.floor((x - layout.margin.left) / layout.cellWidth);
        const weekday = Math.floor((y - layout.margin.top) / layout.cellHeight);
        return layout.cellsByPosition.get(`${week}:${weekday}`) || null;
      }

      function destroyHeatmapInstances() {
        locationHeatmapInstance?.destroy?.();
        stationHeatmapInstance?.destroy?.();
        locationHeatmapInstance = null;
        stationHeatmapInstance = null;
        overallHeatmapRows = [];
        locationHeatmapRows = [];
        stationHeatmapRows = [];
        heatmapInstances.forEach((instance) => instance?.destroy?.());
        heatmapInstances = [];
      }

      function createHeatmapRenderer(canvas, rows, colorDomain = null, options = {}) {
        canvas.classList.add("heatmap-canvas");
        let activeColorDomain = colorDomain;
        let layout = drawHeatmapCanvas(canvas, rows, activeColorDomain);

        const handleMove = (event) => {
          const bounds = canvas.getBoundingClientRect();
          const cell = heatmapCellAt(
            layout,
            event.clientX - bounds.left,
            event.clientY - bounds.top,
          );
          canvas.style.cursor = cell ? "pointer" : "default";
          canvas.title = cell
            ? `${HEATMAP_WEEKDAY_FULL_LABELS[cell.weekday]}, ${formatHistoryDay(
                cell.date,
              )}: ${formatFuelPrice(cell.price)} EUR/l`
            : "";
        };
        const handleLeave = () => {
          canvas.style.cursor = "default";
          canvas.title = "";
        };
        const handleClick = (event) => {
          if (typeof options.onCellClick !== "function") return;
          const bounds = canvas.getBoundingClientRect();
          const cell = heatmapCellAt(
            layout,
            event.clientX - bounds.left,
            event.clientY - bounds.top,
          );
          if (cell) options.onCellClick(cell);
        };
        canvas.addEventListener("mousemove", handleMove);
        canvas.addEventListener("mouseleave", handleLeave);
        canvas.addEventListener("click", handleClick);

        return {
          options: {},
          destroy() {
            canvas.removeEventListener("mousemove", handleMove);
            canvas.removeEventListener("mouseleave", handleLeave);
            canvas.removeEventListener("click", handleClick);
            canvas.classList.remove("heatmap-canvas");
            canvas.style.cursor = "default";
            canvas.title = "";
            const ctx = canvas.getContext("2d");
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          },
          update() {
            layout = drawHeatmapCanvas(canvas, rows, activeColorDomain);
          },
          setColorDomain(domain) {
            activeColorDomain = domain;
            layout = drawHeatmapCanvas(canvas, rows, activeColorDomain);
          },
        };
      }

      function renderHeatmapChart(rows) {
        const canvas = document.getElementById("chart");
        if (chartInstance) chartInstance.destroy();
        overallHeatmapRows = rows;
        chartInstance = createHeatmapRenderer(
          canvas,
          rows,
          currentHeatmapColorDomain(),
          {
            onCellClick: (cell) => {
              handleOverallHeatmapCellClick(cell).catch(() => {
                renderHeatmapDetailMessage(
                  overallHeatmapDetailEl,
                  "Der Preisvergleich konnte nicht geladen werden.",
                );
              });
            },
          },
        );
        syncHeatmapColorDomains();
      }

      function stationDisplayName(stationId) {
        const station = stationCatalog?.get(stationId);
        if (!station) return stationId;
        const parts = [
          station.brand && station.brand !== station.name ? station.brand : "",
          station.name,
          station.street,
        ].filter(Boolean);
        return parts.join(" · ");
      }

      function stationAddress(station) {
        if (!station) return "";
        const streetLine = [station.street, station.houseNumber]
          .filter((part) => part && part.trim())
          .join(" ")
          .replace(/\s+/g, " ")
          .trim();
        const cityLine = [station.postCode, station.city]
          .filter((part) => part && part.trim())
          .join(" ")
          .replace(/\s+/g, " ")
          .trim();
        return [streetLine, cityLine].filter(Boolean).join(", ");
      }

      function noonSnapshotUrl(dateLabel) {
        const [year, month, day] = String(dateLabel || "").split("-");
        return `${DATA_BASE}${year}/${month}/${day}/noon.csv`;
      }

      async function loadNoonSnapshot(dateLabel) {
        if (noonSnapshotCache.has(dateLabel)) return noonSnapshotCache.get(dateLabel);
        const rows = await fetchCsv(noonSnapshotUrl(dateLabel));
        noonSnapshotCache.set(dateLabel, rows);
        return rows;
      }

      function buildStationPriceRows(snapshotRows, catalog, allowedStationIds = null) {
        const allowed = allowedStationIds ? new Set(allowedStationIds) : null;
        return snapshotRows
          .map((row) => {
            const id = String(row.station_uuid || "").trim();
            if (!id || (allowed && !allowed.has(id))) return null;
            const price = Number(row[fuel]);
            if (!Number.isFinite(price) || price <= 0) return null;
            const station = catalog.get(id);
            return {
              id,
              name: stationDisplayName(id),
              price,
              address: stationAddress(station),
            };
          })
          .filter(Boolean);
      }

      function getStationPriceComparison(priceRows, limit) {
        const byNameAscending = (left, right) =>
          left.name.localeCompare(right.name, "de", { sensitivity: "base" });
        const cheapest = [...priceRows]
          .sort((left, right) => left.price - right.price || byNameAscending(left, right))
          .slice(0, limit);
        const mostExpensive = [...priceRows]
          .sort((left, right) => right.price - left.price || byNameAscending(left, right))
          .slice(0, limit);
        return {
          mostExpensive,
          cheapest,
        };
      }

      function resetHeatmapDetail(detailEl) {
        if (!detailEl) return;
        detailEl.innerHTML = "";
        const hint = document.createElement("p");
        hint.className = "heatmap-detail-hint";
        hint.textContent = HEATMAP_DETAIL_HINT;
        detailEl.append(hint);
      }

      function renderHeatmapDetailMessage(detailEl, message) {
        if (!detailEl) return;
        detailEl.innerHTML = "";
        const panel = document.createElement("div");
        panel.className = "heatmap-comparison";
        const closeButton = document.createElement("button");
        closeButton.className = "heatmap-comparison-close";
        closeButton.type = "button";
        closeButton.setAttribute("aria-label", "Preisvergleich schließen");
        closeButton.textContent = "×";
        closeButton.addEventListener("click", () => resetHeatmapDetail(detailEl));
        const text = document.createElement("p");
        text.className = "heatmap-detail-message";
        text.textContent = message;
        panel.append(closeButton, text);
        detailEl.append(panel);
      }

      function appendComparisonCells(tableRow, row) {
        const nameCell = document.createElement("td");
        nameCell.className = "heatmap-station-cell";
        nameCell.textContent = row?.name || "";
        const priceCell = document.createElement("td");
        priceCell.className = "heatmap-price-cell";
        priceCell.textContent = row ? `${formatFuelPrice(row.price)}\u00A0€` : "";
        const addressCell = document.createElement("td");
        addressCell.className = "heatmap-address-cell";
        addressCell.textContent = row?.address || "";
        tableRow.append(nameCell, priceCell, addressCell);
      }

      function createComparisonTable(title, rows) {
        const table = document.createElement("table");
        table.className = "heatmap-comparison-table";
        const colgroup = document.createElement("colgroup");
        [
          "heatmap-station-col",
          "heatmap-price-col",
          "heatmap-address-col",
        ].forEach((className) => {
          const col = document.createElement("col");
          col.className = className;
          colgroup.append(col);
        });
        const thead = document.createElement("thead");
        const groupRow = document.createElement("tr");
        const groupHeader = document.createElement("th");
        groupHeader.scope = "colgroup";
        groupHeader.colSpan = 3;
        groupHeader.textContent = title;
        groupRow.append(groupHeader);
        const labelRow = document.createElement("tr");
        ["Tankstelle", "Preis", "Adresse"].forEach((label) => {
          const header = document.createElement("th");
          header.scope = "col";
          header.textContent = label;
          labelRow.append(header);
        });
        thead.append(groupRow, labelRow);

        const tbody = document.createElement("tbody");
        rows.forEach((priceRow) => {
          const row = document.createElement("tr");
          appendComparisonCells(row, priceRow);
          tbody.append(row);
        });
        table.append(colgroup, thead, tbody);
        return table;
      }

      function renderPriceComparison(detailEl, dateLabel, comparison) {
        if (!detailEl) return;
        detailEl.innerHTML = "";
        const panel = document.createElement("div");
        panel.className = "heatmap-comparison heatmap-comparison--table";
        const header = document.createElement("div");
        header.className = "heatmap-comparison-header";
        const titleEl = document.createElement("h4");
        titleEl.textContent = `Preisvergleich am ${formatHistoryDay(dateLabel)}`;
        const closeButton = document.createElement("button");
        closeButton.className = "heatmap-comparison-close";
        closeButton.type = "button";
        closeButton.setAttribute("aria-label", "Preisvergleich schließen");
        closeButton.textContent = "×";
        closeButton.addEventListener("click", () => resetHeatmapDetail(detailEl));
        header.append(titleEl, closeButton);

        const stack = document.createElement("div");
        stack.className = "heatmap-comparison-stack";
        [
          ["Teuerste", comparison.mostExpensive],
          ["Günstigste", comparison.cheapest],
        ].forEach(([sectionTitle, rows]) => {
          const tableWrap = document.createElement("div");
          tableWrap.className = "heatmap-comparison-table-wrap";
          tableWrap.append(createComparisonTable(sectionTitle, rows));
          stack.append(tableWrap);
        });
        panel.append(header, stack);
        detailEl.append(panel);
      }

      async function handleOverallHeatmapCellClick(cell) {
        await loadStationCatalog();
        const snapshotRows = await loadNoonSnapshot(cell.date);
        const priceRows = buildStationPriceRows(snapshotRows, stationCatalog);
        if (!priceRows.length) {
          renderHeatmapDetailMessage(
            overallHeatmapDetailEl,
            "Ein Preisvergleich ist für diesen Tag nicht möglich, da keine Preisdaten vorliegen.",
          );
          return;
        }
        renderPriceComparison(
          overallHeatmapDetailEl,
          cell.date,
          getStationPriceComparison(priceRows, 3),
        );
      }

      async function handleLocationHeatmapCellClick(cell, location) {
        const stationIds = Array.isArray(location?.station_ids)
          ? location.station_ids
          : [];
        if (stationIds.length <= 1) {
          renderHeatmapDetailMessage(
            locationHeatmapDetailEl,
            "Ein Preisvergleich ist für diesen Standort nicht möglich, da nur eine einzige Tankstelle vorhanden ist.",
          );
          return;
        }
        await loadStationCatalog();
        const snapshotRows = await loadNoonSnapshot(cell.date);
        const priceRows = buildStationPriceRows(snapshotRows, stationCatalog, stationIds);
        if (!priceRows.length) {
          renderHeatmapDetailMessage(
            locationHeatmapDetailEl,
            "Ein Preisvergleich ist für diesen Tag nicht möglich, da keine Preisdaten vorliegen.",
          );
          return;
        }
        renderPriceComparison(
          locationHeatmapDetailEl,
          cell.date,
          getStationPriceComparison(priceRows, 1),
        );
      }

      function resetStationSelect(text = "Erst Standort wählen") {
        stationSelectEl.innerHTML = "";
        const option = document.createElement("option");
        option.value = "";
        option.textContent = text;
        stationSelectEl.append(option);
        stationSelectEl.disabled = true;

      function populateLocationSelect(summary) {
        const previousValue = locationSelectEl.value;
        locationSelectEl.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Standort wählen";
        locationSelectEl.append(placeholder);

        (summary.locations || []).forEach((location) => {
          const option = document.createElement("option");
          option.value = location.key;
          option.textContent = `${location.label} (${location.station_count})`;
          locationSelectEl.append(option);
        });

        if (
          previousValue &&
          Array.from(locationSelectEl.options).some((option) => option.value === previousValue)
        ) {
          locationSelectEl.value = previousValue;
        }
      }

      function selectedLocationPayload() {
        const key = locationSelectEl.value;
        if (!key || !heatmapSummary) return null;
        return (heatmapSummary.locations || []).find((location) => location.key === key) || null;
      }

      async function populateStationSelect(location) {
        resetStationSelect("Tankstelle wählen");
        if (!location) return;
        await loadStationCatalog();
        const stations = (location.station_ids || [])
          .map((id) => ({
            id,
            label: stationDisplayName(id),
          }))
          .sort((left, right) => left.label.localeCompare(right.label, "de"));

        stationSelectEl.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Tankstelle wählen";
        stationSelectEl.append(placeholder);
        stations.forEach((station) => {

          option.value = station.id;
          option.textContent = station.label;
          stationSelectEl.append(option);

      async function renderStationHeatmap(stationIdValue) {
        hideStationHeatmap();
        if (!stationIdValue) return;
        const historyUrl = `${DATA_BASE}${stationPath(stationIdValue)}/${fuel}/history.csv`;
        const rows = normalizeHistoryRows(await fetchCsv(historyUrl));
        if (!rows.length) return;
        stationHeatmapTitleEl.textContent = `Tankstelle: ${stationDisplayName(stationIdValue)}`;
        stationHeatmapSubEl.textContent = buildHeatmapSubtitle(rows, "Einzelstation");
        stationHeatmapPanelEl.hidden = false;
        stationHeatmapRows = rows;
        stationHeatmapInstance = createHeatmapRenderer(
          document.getElementById("station-heatmap"),
          rows,
          currentHeatmapColorDomain(),
        );
        syncHeatmapColorDomains();
      }

      async function handleLocationChange() {
        hideStationHeatmap();
        const location = selectedLocationPayload();
        await populateStationSelect(location);
        renderLocationHeatmap(location);
      }

      async function handleStationChange() {
        await renderStationHeatmap(stationSelectEl.value);
      }

      function renderNoonHistoryChart(rows) {
        const labels = rows.map((row) => formatHistoryTick(row.date));
        const values = rows.map((row) => row.price);
        const domain = computeSeriesDomain(values);
        const ctx = document.getElementById("chart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                data: values,
                borderColor: HISTORY_COLOR.stroke,
                backgroundColor: HISTORY_COLOR.fill,
                borderWidth: 2.4,
                pointRadius: 2.5,
                pointHoverRadius: 5,
                pointBackgroundColor: HISTORY_COLOR.stroke,
                pointBorderColor: HISTORY_COLOR.stroke,
                fill: true,
                tension: 0.2,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: "Datum",
                },
                ticks: {
                  align: "start",
                },
              },
              y: {
                min: domain.min,
                max: domain.max,
                ticks: {
                  callback(value) {
                    return formatFuelPrice(value);
                  },
                },
                title: {
                  display: true,
                  text: "Mittagspreis (€/l)",
                },
              },
            },
            plugins: {
              legend: {
                display: false,
              },
              tooltip: {
                callbacks: {
                  title(context) {
                    const row = rows[context[0].dataIndex];
                    return row ? formatHistoryDay(row.date) : "";
                  },
                  label(context) {
                    const row = rows[context.dataIndex];
                    if (!row) return "";
                    return `${formatFuelPrice(row.price)} €/l`;
                  },
                  afterBody(context) {
                    const row = rows[context[0].dataIndex];
                    const lastUpdate = row?.lastUpdate || "";
                    return lastUpdate ? [lastUpdate] : [];
                  },
                },
              },
            },
          }),
        });
      }

      function renderReferenceChart(stats) {
        const hourly = Array.isArray(stats?.hourly) ? stats.hourly : [];
        const displaySeries = hourly
          .map((row) => ({
            hour: Number(row?.hour ?? 0),
            displayValue: sanitizeRelativeValue(Number(row?.price ?? 0)),
          }))
          .filter((row) => Number.isFinite(row.hour));
        const labels = displaySeries.map(
          (row) => `${String(row.hour).padStart(2, "0")}:00`,
        );
        const priorDayValues = displaySeries.map((row, index) =>
          index < 12 ? row.displayValue : null,
        );
        const sameDayValues = displaySeries.map((row, index) =>
          index >= 12 ? row.displayValue : null,
        );
        const noonRow = displaySeries.find((row) => row.hour === 12);
        const preNoonRow = displaySeries.find((row) => row.hour === 11);
        const domain = computeSeriesDomain(
          displaySeries.map((row) => row.displayValue),
          true,
        );
        const ctx = document.getElementById("chart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          plugins: [noonDividerPlugin],
          data: {
            labels,
            datasets: [
              {
                label: "00:00 - 11:59",
                data: priorDayValues,
                borderColor: PRIOR_DAY_COLOR.stroke,
                backgroundColor: PRIOR_DAY_COLOR.stroke,
                borderWidth: 2.4,
                pointRadius: 1.8,
                pointHoverRadius: 4,
                pointBackgroundColor: PRIOR_DAY_COLOR.stroke,
                pointBorderColor: PRIOR_DAY_COLOR.stroke,
                stepped: "before",
                tension: 0,
                spanGaps: false,
                fill: false,
              },
              {
                label: "12:00 - 23:59",
                data: sameDayValues,
                borderColor: SAME_DAY_COLOR.stroke,
                backgroundColor: SAME_DAY_COLOR.stroke,
                borderWidth: 2.4,
                pointRadius: 1.8,
                pointHoverRadius: 4,
                pointBackgroundColor: SAME_DAY_COLOR.stroke,
                pointBorderColor: SAME_DAY_COLOR.stroke,
                stepped: "before",
                tension: 0,
                spanGaps: false,
                fill: false,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: "Stunde",
                },
                ticks: {
                  align: "start",
                },
              },
              y: {
                min: domain.min,
                max: domain.max,
                ticks: {
                  callback(value) {
                    return formatEuroTick(value);
                  },
                },
                grid: {
                  color(context) {
                    return context.tick.value === 0
                      ? "rgba(37, 99, 235, 0.28)"
                      : currentChartTheme().grid;
                  },
                },
                title: {
                  display: true,
                  text: "Preisänderung zur jeweiligen 12:00-Referenz (€/l)",
                },
              },
            },
            plugins: {
              legend: {
                position: "bottom",
              },
              noonDivider: {
                enabled: labels.length >= 24,
                noonValue: noonRow?.displayValue,
                preNoonValue: preNoonRow?.displayValue,
              },
              tooltip: {
                callbacks: {
                  label(context) {
                    const row = displaySeries[context.dataIndex];
                    if (!row) return "";
                    return formatRelativeChange(row.displayValue, row.hour);
                  },
                  afterBody(context) {
                    return referenceTooltipLines(displaySeries[context[0]?.dataIndex]);
                  },
                },
              },
            },
          }),
        });
      }

      function normalizeCycleRows(stats) {
        const rows = Array.isArray(stats?.cycle_hourly) ? stats.cycle_hourly : [];
        return rows
          .map((row) => {
            const cycleHour = Number(row?.cycle_hour);
            const clockHour = Number(
              row?.clock_hour != null ? row.clock_hour : row?.label,
            );
            const deltaCandidates = [
              row?.delta_median,
              row?.delta_avg,
              row?.delta_max,
              row?.delta_min,
            ];
            let deltaValue = null;
            for (const candidate of deltaCandidates) {
              const numeric = Number(candidate);
              if (Number.isFinite(numeric)) {
                deltaValue = numeric;
                break;
              }
            }
            if (deltaValue === null) {
              const markdownCandidates = [
                row?.markdown_median,
                row?.markdown_avg,
                row?.markdown_max,
                row?.markdown_min,
              ];
              for (const candidate of markdownCandidates) {
                const numeric = Number(candidate);
                if (Number.isFinite(numeric)) {
                  deltaValue = -numeric;
                  break;
                }
              }
            }
            if (!Number.isFinite(cycleHour) || !Number.isFinite(clockHour) || deltaValue === null) {
              return null;
            }
            return {
              cycleHour,
              clockHour: ((Math.round(clockHour) % 24) + 24) % 24,
              label:
                typeof row?.label === "string" && row.label.trim()
                  ? row.label.trim()
                  : String(((Math.round(clockHour) % 24) + 24) % 24).padStart(2, "0"),
              displayValue: sanitizeRelativeValue(deltaValue),
            };
          })
          .filter((row) => row !== null)
          .sort((left, right) => left.cycleHour - right.cycleHour);
      }

      function renderCycleReferenceChart(stats) {
        const cycleRows = normalizeCycleRows(stats);
        const labels = cycleRows.map((row) => `${row.label}:00`);
        const values = cycleRows.map((row) => row.displayValue);
        const domain = computeSeriesDomain(values, true);
        const midnightIndex = cycleRows.findIndex((row) => row.clockHour === 0);
        const ctx = document.getElementById("chart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          plugins: [midnightDividerPlugin],
          data: {
            labels,
            datasets: [
              {
                label: "12:00 Vortag → 12:00 Tag",
                data: values,
                borderColor: SAME_DAY_COLOR.stroke,
                backgroundColor: SAME_DAY_COLOR.stroke,
                borderWidth: 2.4,
                pointRadius: 1.8,
                pointHoverRadius: 4,
                pointBackgroundColor: SAME_DAY_COLOR.stroke,
                pointBorderColor: SAME_DAY_COLOR.stroke,
                stepped: "before",
                tension: 0,
                spanGaps: false,
                fill: false,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: "Stunde im 24h-Zyklus (12 Vortag → 12 Tag)",
                },
                ticks: {
                  align: "start",
                },
              },
              y: {
                min: domain.min,
                max: domain.max,
                ticks: {
                  callback(value) {
                    return formatEuroTick(value);
                  },
                },
                grid: {
                  color(context) {
                    return context.tick.value === 0
                      ? "rgba(37, 99, 235, 0.28)"
                      : currentChartTheme().grid;
                  },
                },
                title: {
                  display: true,
                  text: "Preisänderung zum 12:00-Anker (€/l)",
                },
              },
            },
            plugins: {
              legend: {
                position: "bottom",
              },
              midnightDivider: {
                enabled: midnightIndex >= 0,
                markerIndex: midnightIndex,
              },
              tooltip: {
                callbacks: {
                  label(context) {
                    const row = cycleRows[context.dataIndex];
                    if (!row) return "";
                    return formatRelativeChange(row.displayValue, 0);
                  },
                  afterBody(context) {
                    const row = cycleRows[context[0]?.dataIndex];
                    if (!row) return [];
                    return [
                      `Zyklus: 12:00 Vortag → 12:00 Tag`,
                      `Uhrzeit: ${row.label}:00`,
                      `Referenz: Vortag 12:00`,
                    ];
                  },
                },
              },
            },
          }),
        });
      }

      function renderLegacyHourlyChart(stats) {
        const hours = stats.hourly.map((row) => row.hour);
        const values = stats.hourly.map((row) => row.price);
        const ctx = document.getElementById("chart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels: hours,
            datasets: [
              {
                label: "Preisabweichung (€/l)",
                data: values,
                borderColor: "#0f766e",
                backgroundColor: "rgba(15, 118, 110, 0.15)",
                tension: 0.3,
                fill: true,
                pointRadius: 2,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                title: { display: true, text: "Stunde" },
              },
              y: {
                title: { display: true, text: "Abweichung (€/l)" },
              },
            },
            plugins: {
              legend: {
                position: "bottom",
              },
            },
          }),
        });
      }

      async function loadHistoryChart() {
        document.getElementById("chart-title").textContent = title;
        const historyUrl = `${DATA_BASE}${stationPath(stationId)}/${fuel}/history.csv`;
        const rows = normalizeHistoryRows(await fetchCsv(historyUrl));
        if (!rows.length) {
          throw new Error("History unavailable");
        }
        document.getElementById("chart-sub").textContent =
          buildHistorySubtitle(rows);
        renderNoonHistoryChart(rows);
      }

      async function loadHeatmapChart() {
        heatmapSummary = await fetchJson(`${DATA_BASE}heatmaps/${fuel}.json`);
        populateLocationSelect(heatmapSummary);
        resetStationSelect();
        hideLocationHeatmap();
        hideStationHeatmap();
        resetHeatmapDetail(overallHeatmapDetailEl);
        resetHeatmapDetail(locationHeatmapDetailEl);

        const rows = normalizeHeatmapRows(
          heatmapSummary?.overall || [],
          heatmapSummary?.dates || [],
        );
        if (!rows.length) {
          throw new Error("Heatmap history unavailable");
        }
        document.getElementById("chart-title").textContent =
          `Gesamtübersicht · ${fuel.toUpperCase()}`;
        document.getElementById("chart-sub").textContent =
          buildHeatmapSubtitle(rows, "Gesamtmarkt-Median");
        renderHeatmapChart(rows);

        if (locationSelectEl.value) {
          const location = selectedLocationPayload();
          await populateStationSelect(location);
          renderLocationHeatmap(location);
        }
      }

      async function loadProfileChart() {
        document.getElementById("chart-title").textContent = title;
        const statsUrl = `${DATA_BASE}${stationPath(stationId)}/${fuel}.json`;
        const stats = await fetchJson(statsUrl);
        if (Array.isArray(stats?.cycle_hourly) && stats.cycle_hourly.length) {
          document.getElementById("chart-sub").textContent =
            buildCycleSubtitle();
          renderCycleReferenceChart(stats);
          return;
        }
        if (
          TankzeitStats.summaryFromStats(stats) &&
          Array.isArray(stats.hourly) &&
          stats.hourly.length
        ) {
          document.getElementById("chart-sub").textContent =
            buildReferenceSubtitle(stats);
          renderReferenceChart(stats);
          return;
        }

        document.getElementById("chart-sub").textContent =
          "Fallback: historische Abweichung vom Tagesmittel (altes Datenformat).";
        renderLegacyHourlyChart(stats);
      }

      async function loadChart() {
        if (!stationId) return;

        if (activeView === "heatmap") {
          try {
            await loadHeatmapChart();
            return;
          } catch (_error) {
            activeView = "profile";
            setButtonState();
            updateViewInUrl();
          }
        }

        // Wait for Chart.js to be available (deferred loading)
        const waitForChart = () =>
          new Promise((resolve) => {
            if (typeof Chart !== "undefined") {
              resolve();
            } else {
              const check = setInterval(() => {
                if (typeof Chart !== "undefined") {
                  clearInterval(check);
                  resolve();
                }
              }, 50);
            }
          });

        await waitForChart();
        if (activeView === "history") {
          try {
            await loadHistoryChart();
            return;
          } catch (_error) {
            activeView = "profile";
            setButtonState();
            updateViewInUrl();
          }
        }
        await loadProfileChart();
      }

      loadChart().catch(() => {
        document.getElementById("chart-sub").textContent =
          "Chart konnte nicht geladen werden.";
      });

      DARK_MODE_MEDIA_QUERY.addEventListener?.("change", () => {
        refreshChartTheme();
      });

      window.addEventListener("resize", () => {
        if (activeView === "heatmap" && chartInstance?.update) {
          window.requestAnimationFrame(() => {
            chartInstance?.update();
            locationHeatmapInstance?.update?.();
            stationHeatmapInstance?.update?.();
          });
        }
      });
    </script>
