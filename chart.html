<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Preisverlauf nach Stunde für eine Tankstelle."
    />
    <meta name="robots" content="noindex,follow" />
    <title>Tankzeit | Chart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="styles.css" as="style" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
    ></script>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand">
          <h1>Tankzeit</h1>
          <p>Preisverlauf nach Stunde.</p>
        </div>
      </header>

      <section class="card chart-card">
        <div class="chart-actions">
          <a class="btn" id="maps-link" href="#" target="_blank" rel="noopener"
            >Zur Tankstelle</a
          >
        </div>
        <h2 class="chart-title" id="chart-title">Lade Chart...</h2>
        <p class="chart-sub" id="chart-sub"></p>
        <canvas id="chart"></canvas>
      </section>
    </main>

    <nav class="nav-bar" aria-label="Hauptnavigation">
      <a href="index.html" class="nav-item diesel">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z"
          />
        </svg>
        <span>Diesel</span>
      </a>
      <a href="e10.html" class="nav-item e10">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z"
          />
        </svg>
        <span>E10</span>
      </a>
      <a href="favoriten.html" class="nav-item">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
          />
        </svg>
        <span>Favoriten</span>
      </a>
      <a href="management.html" class="nav-item">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="10" width="4" height="11" />
          <rect x="10" y="5" width="4" height="16" />
          <rect x="17" y="8" width="4" height="13" />
        </svg>
        <span>Statistik</span>
      </a>
      <a href="info.html" class="nav-item">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4M12 8h.01" />
        </svg>
        <span>Info</span>
      </a>
    </nav>

    <script>
      const params = new URLSearchParams(window.location.search);
      const stationId = params.get("id");
      const fuel = params.get("fuel") || "diesel";
      const name = params.get("name") || "Tankstelle";
      const lat = params.get("lat");
      const lng = params.get("lng");
      const DATA_BASE = "data2/";

      const title = `${name} · ${fuel.toUpperCase()}`;
      document.getElementById("chart-title").textContent = title;
      document.getElementById("chart-sub").textContent =
        "Durchschnittliche Abweichung vom Tagesmittel (letzte 8 Tage).";

      if (lat && lng) {
        const maps = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
        const link = document.getElementById("maps-link");
        link.href = maps;
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.json();
      }

      async function loadChart() {
        if (!stationId) return;

        // Wait for Chart.js to be available (deferred loading)
        const waitForChart = () =>
          new Promise((resolve) => {
            if (typeof Chart !== "undefined") {
              resolve();
            } else {
              const check = setInterval(() => {
                if (typeof Chart !== "undefined") {
                  clearInterval(check);
                  resolve();
                }
              }, 50);
            }
          });

        await waitForChart();

        const statsUrl = `${DATA_BASE}${stationId.split("-").join("/")}/${fuel}.json`;
        const stats = await fetchJson(statsUrl);
        const hours = stats.hourly.map((row) => row.hour);
        const values = stats.hourly.map((row) => row.price);

        const ctx = document.getElementById("chart").getContext("2d");
        new Chart(ctx, {
          type: "line",
          data: {
            labels: hours,
            datasets: [
              {
                label: "Preisabweichung (€/l)",
                data: values,
                borderColor: "#0f766e",
                backgroundColor: "rgba(15, 118, 110, 0.15)",
                tension: 0.3,
                fill: true,
                pointRadius: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                title: { display: true, text: "Stunde" },
              },
              y: {
                title: { display: true, text: "Abweichung (€/l)" },
              },
            },
          },
        });
      }

      loadChart().catch(() => {
        document.getElementById("chart-sub").textContent =
          "Chart konnte nicht geladen werden.";
      });
    </script>
  </body>
</html>
