    <script src="web-config.js?v=20260725-simple-v1"></script>
    <script src="app-stats.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const stationId = params.get("id");
      const fuel = (params.get("fuel") || "diesel").toLowerCase();
      const name = params.get("name") || "Tankstelle";
      const lat = params.get("lat");
      const lng = params.get("lng");
      const APP_TIME_ZONE = "Europe/Berlin";
      const DATA_BASE = window.TankzeitWebConfig?.dataBase || "data2/";
      const HISTORY_START = "2026-04-01";
      let chartInstance = null;
      let activeView = params.get("view") === "profile" ? "profile" : "history";
      const DARK_MODE_MEDIA_QUERY = window.matchMedia(
        "(prefers-color-scheme: dark)",
      );
      const PRIOR_DAY_COLOR = {
        fill: "rgba(107, 114, 128, 0.2)",
        stroke: "#6b7280",
      };
      const SAME_DAY_COLOR = {
        fill: "rgba(37, 99, 235, 0.2)",
        stroke: "#2563eb",
      };
      const HISTORY_COLOR = {
        stroke: "#0f766e",
        fill: "rgba(15, 118, 110, 0.16)",
      };

      function currentChartTheme() {
        if (DARK_MODE_MEDIA_QUERY.matches) {
          return {
            axisLabel: "rgba(237, 244, 243, 0.82)",
            axisTitle: "rgba(237, 244, 243, 0.92)",
            grid: "rgba(148, 163, 184, 0.18)",
            border: "rgba(148, 163, 184, 0.3)",
            tooltipBackground: "rgba(9, 14, 17, 0.96)",
            tooltipBorder: "rgba(126, 165, 158, 0.2)",
            tooltipText: "#edf4f3",
          };
        }
        return {
          axisLabel: "rgba(17, 24, 39, 0.72)",
          axisTitle: "rgba(17, 24, 39, 0.88)",
          grid: "rgba(0, 0, 0, 0.08)",
          border: "rgba(17, 24, 39, 0.16)",
          tooltipBackground: "rgba(255, 255, 255, 0.96)",
          tooltipBorder: "rgba(15, 23, 42, 0.1)",
          tooltipText: "#111827",
        };
      }

      function applyChartTheme(options) {
        const theme = currentChartTheme();
        const themedOptions = {
          ...options,
          scales: {
            ...(options.scales || {}),
          },
          plugins: {
            ...(options.plugins || {}),
          },
        };
        ["x", "y"].forEach((axisKey) => {
          const axis = themedOptions.scales?.[axisKey];
          if (!axis) return;
          themedOptions.scales[axisKey] = {
            ...axis,
            ticks: {
              ...(axis.ticks || {}),
              color: theme.axisLabel,
            },
            title: axis.title
              ? {
                  ...axis.title,
                  color: theme.axisTitle,
                }
              : axis.title,
            grid: {
              ...(axis.grid || {}),
              color:
                axis.grid && Object.prototype.hasOwnProperty.call(axis.grid, "color")
                  ? axis.grid.color
                  : theme.grid,
            },
            border: {
              ...(axis.border || {}),
              color: theme.border,
            },
          };
        });
        if (themedOptions.plugins.legend !== false) {
          themedOptions.plugins.legend = {
            ...(themedOptions.plugins.legend || {}),
            labels: {
              ...((themedOptions.plugins.legend || {}).labels || {}),
              color: theme.axisLabel,
            },
          };
        }
        themedOptions.plugins.tooltip = {
          ...(themedOptions.plugins.tooltip || {}),
          backgroundColor: theme.tooltipBackground,
          borderColor: theme.tooltipBorder,
          borderWidth: 1,
          titleColor: theme.tooltipText,
          bodyColor: theme.tooltipText,
          footerColor: theme.tooltipText,
        };
        return themedOptions;
      }

      function refreshChartTheme() {
        if (!chartInstance) return;
        chartInstance.options = applyChartTheme(chartInstance.options || {});
        chartInstance.update();
      }

      const noonDividerPlugin = {
        id: "noonDivider",
        afterDatasetsDraw(chart, _args, options) {
          if (!options || options.enabled === false) return;
          const xScale = chart.scales?.x;
          const yScale = chart.scales?.y;
          const chartArea = chart.chartArea;
          const labels = chart.data?.labels;
          if (
            !xScale ||
            !yScale ||
            !chartArea ||
            !Array.isArray(labels) ||
            labels.length < 13
          ) {
            return;
          }
          const dividerX = xScale.getPixelForValue(12);
          const { ctx } = chart;
          ctx.save();
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = "rgba(37, 99, 235, 0.38)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(dividerX, chartArea.top);
          ctx.lineTo(dividerX, chartArea.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(37, 99, 235, 0.82)";
          ctx.font = "12px Manrope, sans-serif";
          ctx.fillText("12:00", dividerX + 6, chartArea.top + 14);
          const noonValue = Number(options.noonValue);
          const preNoonValue = Number(options.preNoonValue);
          const noonY = yScale.getPixelForValue(noonValue);
          const preNoonY = yScale.getPixelForValue(preNoonValue);
          if (
            Number.isFinite(noonValue) &&
            noonY >= chartArea.top &&
            noonY <= chartArea.bottom &&
            Number.isFinite(preNoonValue) &&
            preNoonY >= chartArea.top &&
            preNoonY <= chartArea.bottom
          ) {
            const connectorX = dividerX + 1.5;
            const label = `${formatSignedRelativeLabel(noonValue)} zum Vortag`;
            const labelMidValue = (preNoonValue + noonValue) / 2 + 0.005;
            const labelY = Math.max(
              chartArea.top + 10,
              Math.min(chartArea.bottom - 10, yScale.getPixelForValue(labelMidValue)),
            );
            ctx.strokeStyle = "rgba(37, 99, 235, 0.74)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(connectorX, preNoonY);
            ctx.lineTo(connectorX, noonY);
            ctx.stroke();
            ctx.fillStyle = "rgba(37, 99, 235, 0.88)";
            ctx.beginPath();
            ctx.arc(connectorX, preNoonY, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(connectorX, noonY, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = "600 12px Manrope, sans-serif";
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.96)";
            ctx.lineWidth = 4;
            ctx.strokeText(label, dividerX - 8, labelY);
            ctx.fillText(label, dividerX - 8, labelY);
          }
          ctx.restore();
        },
      };
      const midnightDividerPlugin = {
        id: "midnightDivider",
        afterDatasetsDraw(chart, _args, options) {
          if (!options || options.enabled === false) return;
          const xScale = chart.scales?.x;
          const chartArea = chart.chartArea;
          if (!xScale || !chartArea || !Number.isFinite(Number(options.markerIndex))) {
            return;
          }
          const dividerX = xScale.getPixelForValue(Number(options.markerIndex));
          const { ctx } = chart;
          ctx.save();
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = "rgba(37, 99, 235, 0.38)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(dividerX, chartArea.top);
          ctx.lineTo(dividerX, chartArea.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(37, 99, 235, 0.82)";
          ctx.font = "12px Manrope, sans-serif";
          ctx.fillText("00:00", dividerX + 6, chartArea.top + 14);
          ctx.restore();
        },
      };
      const historyButton = document.getElementById("history-view");
      const profileButton = document.getElementById("profile-view");

      const title = `${name} · ${fuel.toUpperCase()}`;
      document.getElementById("chart-title").textContent = title;
      document.getElementById("chart-sub").textContent = "Lade Chart...";

      if (lat && lng) {
        const maps = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
        const link = document.getElementById("maps-link");
        link.href = maps;
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.json();
      }

      async function fetchCsv(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return parseCsv(await response.text());
      }

      function parseCsv(text) {
        const lines = text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
        if (!lines.length) return [];
        const headers = lines[0].split(",").map((header) => header.trim());
        return lines.slice(1).map((line) => {
          const values = line.split(",");
          const row = {};
          headers.forEach((header, index) => {
            row[header] = values[index] ?? "";
          });
          return row;
        });
      }

      function stationPath(station) {
        return station.split("-").join("/");
      }

      function setButtonState() {
        historyButton.classList.toggle("primary", activeView === "history");
        profileButton.classList.toggle("primary", activeView === "profile");
      }

      function updateViewInUrl() {
        params.set("view", activeView);
        const nextUrl = `${window.location.pathname}?${params.toString()}`;
        window.history.replaceState({}, "", nextUrl);
      }

      function switchView(view) {
        activeView = view;
        setButtonState();
        updateViewInUrl();
        loadChart();
      }

      historyButton.addEventListener("click", () => switchView("history"));
      profileButton.addEventListener("click", () => switchView("profile"));
      setButtonState();
      updateViewInUrl();

      function referenceMetaForHour(hour) {
        return Number(hour) < 12
          ? {
              label: "Vortag 12:00",
              period: "00:00 - 11:59",
            }
          : {
              label: "Tages-12:00",
              period: "12:00 - 23:59",
            };
      }

      function buildReferenceSubtitle() {
        return `${fuel.toUpperCase()} · Preisänderung zur jeweiligen 12:00-Referenz · Grau = 00:00-11:59 ggü. Vortag 12:00 · Blau = 12:00-23:59 ggü. Tages-12:00 · negative Werte = günstiger, positive Werte = teurer`;
      }

      function buildCycleSubtitle() {
        return `${fuel.toUpperCase()} · Preisänderung zur ausgewählten 12:00-Referenz im Zyklus 12:00 Vortag → 12:00 Tag · Erhöhungen bis 12:15 zählen noch zum Noon-Anker, spätere nicht · Mitternacht markiert die Tagesgrenze`;
      }

      function sanitizeRelativeValue(valueInEuro) {
        const amount = Number(valueInEuro);
        if (!Number.isFinite(amount)) return 0;
        return amount;
      }

      function formatRelativeChange(valueInEuro, hour) {
        const amount = sanitizeRelativeValue(valueInEuro);
        const referenceMeta = referenceMetaForHour(hour);
        if (!Number.isFinite(amount)) return "-";
        if (Math.abs(amount) < 0.0005) return `auf ${referenceMeta.label}-Niveau`;
        return `${(Math.abs(amount) * 100).toFixed(1)} ct/l ${
          amount > 0 ? "teurer" : "günstiger"
        } als ${referenceMeta.label}`;
      }

      function formatSignedRelativeLabel(valueInEuro) {
        const cents = sanitizeRelativeValue(valueInEuro) * 100;
        if (Math.abs(cents) < 0.05) return "0,0 ct/l";
        return `${cents > 0 ? "+" : "-"}${new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 1,
          maximumFractionDigits: 1,
        }).format(Math.abs(cents))} ct/l`;
      }

      function formatEuroTick(valueInEuro) {
        const amount = Number(valueInEuro);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(amount);
      }

      function formatFuelPrice(valueInEuro) {
        const amount = Number(valueInEuro);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 3,
          maximumFractionDigits: 3,
        }).format(amount);
      }

      function computeSeriesDomain(values, includeZero = false) {
        const finiteValues = values.filter((value) => Number.isFinite(value));
        if (!finiteValues.length) {
          return { min: -0.05, max: 0.05 };
        }
        let min = Math.min(...finiteValues);
        let max = Math.max(...finiteValues);
        if (includeZero) {
          min = Math.min(min, 0);
          max = Math.max(max, 0);
        }
        if (Math.abs(max - min) < 0.0005) {
          const pad = Math.max(0.01, Math.abs(max || 0.01) * 0.2);
          return { min: min - pad, max: max + pad };
        }
        const pad = Math.max(0.01, (max - min) * 0.12);
        return { min: min - pad, max: max + pad };
      }

      function referenceTooltipLines(row) {
        const referenceMeta = referenceMetaForHour(row?.hour);
        return [
          `Zeitraum: ${referenceMeta.period}`,
          `Referenz: ${referenceMeta.label}`,
        ];
      }

      function formatHistoryDay(day) {
        const [year, month, date] = String(day).split("-");
        if (!year || !month || !date) return String(day);
        return `${date}.${month}.${year}`;
      }

      function formatHistoryTick(day) {
        const [year, month, date] = String(day).split("-");
        if (!year || !month || !date) return String(day);
        return `${date}.${month}.`;
      }

      function formatLastUpdate(lastUpdate) {
        if (!lastUpdate) return null;
        const parsed = new Date(lastUpdate);
        if (Number.isNaN(parsed.getTime())) return lastUpdate;
        return new Intl.DateTimeFormat("de-DE", {
          timeZone: APP_TIME_ZONE,
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        }).format(parsed);
      }

      function normalizeHistoryRows(rows) {
        return rows
          .map((row) => ({
            date: String(row.date || "").trim(),
            price: Number(row.price),
            lastUpdate: String(row.last_update || "").trim(),
          }))
          .filter(
            (row) =>
              row.date &&
              row.date >= HISTORY_START &&
              Number.isFinite(row.price),
          )
          .sort((left, right) => left.date.localeCompare(right.date));
      }

      function buildHistorySubtitle(rows) {
        if (!rows.length) {
          return `${fuel.toUpperCase()} · Keine Mittagspreise ab ${formatHistoryDay(HISTORY_START)} verfügbar.`;
        }
        const first = rows[0].date;
        const last = rows[rows.length - 1].date;
        return [
          `${fuel.toUpperCase()} · Mittagspreise`,
          `${rows.length} Tage`,
          `${formatHistoryDay(first)} - ${formatHistoryDay(last)}`,
          "y-Achse = etablierter Mittagspreis",
        ].join(" · ");
      }

      function renderNoonHistoryChart(rows) {
        const labels = rows.map((row) => formatHistoryTick(row.date));
        const values = rows.map((row) => row.price);
        const domain = computeSeriesDomain(values);
        const ctx = document.getElementById("chart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                data: values,
                borderColor: HISTORY_COLOR.stroke,
                backgroundColor: HISTORY_COLOR.fill,
                borderWidth: 2.4,
                pointRadius: 2.5,
                pointHoverRadius: 5,
                pointBackgroundColor: HISTORY_COLOR.stroke,
                pointBorderColor: HISTORY_COLOR.stroke,
                fill: true,
                tension: 0.2,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: "Datum",
                },
                ticks: {
                  align: "start",
                },
              },
              y: {
                min: domain.min,
                max: domain.max,
                ticks: {
                  callback(value) {
                    return formatFuelPrice(value);
                  },
                },
                title: {
                  display: true,
                  text: "Mittagspreis (€/l)",
                },
              },
            },
            plugins: {
              legend: {
                display: false,
              },
              tooltip: {
                callbacks: {
                  title(context) {
                    const row = rows[context[0].dataIndex];
                    return row ? formatHistoryDay(row.date) : "";
                  },
                  label(context) {
                    const row = rows[context.dataIndex];
                    if (!row) return "";
                    return `${formatFuelPrice(row.price)} €/l`;
                  },
                  afterBody(context) {
                    const row = rows[context[0].dataIndex];
                    const lastUpdate = row?.lastUpdate || "";
                    return lastUpdate ? [lastUpdate] : [];
                  },
                },
              },
            },
          }),
        });
      }

      function renderReferenceChart(stats) {
        const hourly = Array.isArray(stats?.hourly) ? stats.hourly : [];
        const displaySeries = hourly
          .map((row) => ({
            hour: Number(row?.hour ?? 0),
            displayValue: sanitizeRelativeValue(Number(row?.price ?? 0)),
          }))
          .filter((row) => Number.isFinite(row.hour));
        const labels = displaySeries.map(
          (row) => `${String(row.hour).padStart(2, "0")}:00`,
        );
        const priorDayValues = displaySeries.map((row, index) =>
          index < 12 ? row.displayValue : null,
        );
        const sameDayValues = displaySeries.map((row, index) =>
          index >= 12 ? row.displayValue : null,
        );
        const noonRow = displaySeries.find((row) => row.hour === 12);
        const preNoonRow = displaySeries.find((row) => row.hour === 11);
        const domain = computeSeriesDomain(
          displaySeries.map((row) => row.displayValue),
          true,
        );
        const ctx = document.getElementById("chart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          plugins: [noonDividerPlugin],
          data: {
            labels,
            datasets: [
              {
                label: "00:00 - 11:59",
                data: priorDayValues,
                borderColor: PRIOR_DAY_COLOR.stroke,
                backgroundColor: PRIOR_DAY_COLOR.stroke,
                borderWidth: 2.4,
                pointRadius: 1.8,
                pointHoverRadius: 4,
                pointBackgroundColor: PRIOR_DAY_COLOR.stroke,
                pointBorderColor: PRIOR_DAY_COLOR.stroke,
                stepped: "before",
                tension: 0,
                spanGaps: false,
                fill: false,
              },
              {
                label: "12:00 - 23:59",
                data: sameDayValues,
                borderColor: SAME_DAY_COLOR.stroke,
                backgroundColor: SAME_DAY_COLOR.stroke,
                borderWidth: 2.4,
                pointRadius: 1.8,
                pointHoverRadius: 4,
                pointBackgroundColor: SAME_DAY_COLOR.stroke,
                pointBorderColor: SAME_DAY_COLOR.stroke,
                stepped: "before",
                tension: 0,
                spanGaps: false,
                fill: false,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: "Stunde",
                },
                ticks: {
                  align: "start",
                },
              },
              y: {
                min: domain.min,
                max: domain.max,
                ticks: {
                  callback(value) {
                    return formatEuroTick(value);
                  },
                },
                grid: {
                  color(context) {
                    return context.tick.value === 0
                      ? "rgba(37, 99, 235, 0.28)"
                      : currentChartTheme().grid;
                  },
                },
                title: {
                  display: true,
                  text: "Preisänderung zur jeweiligen 12:00-Referenz (€/l)",
                },
              },
            },
            plugins: {
              legend: {
                position: "bottom",
              },
              noonDivider: {
                enabled: labels.length >= 24,
                noonValue: noonRow?.displayValue,
                preNoonValue: preNoonRow?.displayValue,
              },
              tooltip: {
                callbacks: {
                  label(context) {
                    const row = displaySeries[context.dataIndex];
                    if (!row) return "";
                    return formatRelativeChange(row.displayValue, row.hour);
                  },
                  afterBody(context) {
                    return referenceTooltipLines(displaySeries[context[0]?.dataIndex]);
                  },
                },
              },
            },
          }),
        });
      }

      function normalizeCycleRows(stats) {
        const rows = Array.isArray(stats?.cycle_hourly) ? stats.cycle_hourly : [];
        return rows
          .map((row) => {
            const cycleHour = Number(row?.cycle_hour);
            const clockHour = Number(
              row?.clock_hour != null ? row.clock_hour : row?.label,
            );
            const deltaCandidates = [
              row?.delta_median,
              row?.delta_avg,
              row?.delta_max,
              row?.delta_min,
            ];
            let deltaValue = null;
            for (const candidate of deltaCandidates) {
              const numeric = Number(candidate);
              if (Number.isFinite(numeric)) {
                deltaValue = numeric;
                break;
              }
            }
            if (deltaValue === null) {
              const markdownCandidates = [
                row?.markdown_median,
                row?.markdown_avg,
                row?.markdown_max,
                row?.markdown_min,
              ];
              for (const candidate of markdownCandidates) {
                const numeric = Number(candidate);
                if (Number.isFinite(numeric)) {
                  deltaValue = -numeric;
                  break;
                }
              }
            }
            if (!Number.isFinite(cycleHour) || !Number.isFinite(clockHour) || deltaValue === null) {
              return null;
            }
            return {
              cycleHour,
              clockHour: ((Math.round(clockHour) % 24) + 24) % 24,
              label:
                typeof row?.label === "string" && row.label.trim()
                  ? row.label.trim()
                  : String(((Math.round(clockHour) % 24) + 24) % 24).padStart(2, "0"),
              displayValue: sanitizeRelativeValue(deltaValue),
            };
          })
          .filter((row) => row !== null)
          .sort((left, right) => left.cycleHour - right.cycleHour);
      }

      function renderCycleReferenceChart(stats) {
        const cycleRows = normalizeCycleRows(stats);
        const labels = cycleRows.map((row) => `${row.label}:00`);
        const values = cycleRows.map((row) => row.displayValue);
        const domain = computeSeriesDomain(values, true);
        const midnightIndex = cycleRows.findIndex((row) => row.clockHour === 0);
        const ctx = document.getElementById("chart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          plugins: [midnightDividerPlugin],
          data: {
            labels,
            datasets: [
              {
                label: "12:00 Vortag → 12:00 Tag",
                data: values,
                borderColor: SAME_DAY_COLOR.stroke,
                backgroundColor: SAME_DAY_COLOR.stroke,
                borderWidth: 2.4,
                pointRadius: 1.8,
                pointHoverRadius: 4,
                pointBackgroundColor: SAME_DAY_COLOR.stroke,
                pointBorderColor: SAME_DAY_COLOR.stroke,
                stepped: "before",
                tension: 0,
                spanGaps: false,
                fill: false,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: "Stunde im 24h-Zyklus (12 Vortag → 12 Tag)",
                },
                ticks: {
                  align: "start",
                },
              },
              y: {
                min: domain.min,
                max: domain.max,
                ticks: {
                  callback(value) {
                    return formatEuroTick(value);
                  },
                },
                grid: {
                  color(context) {
                    return context.tick.value === 0
                      ? "rgba(37, 99, 235, 0.28)"
                      : currentChartTheme().grid;
                  },
                },
                title: {
                  display: true,
                  text: "Preisänderung zum 12:00-Anker (€/l)",
                },
              },
            },
            plugins: {
              legend: {
                position: "bottom",
              },
              midnightDivider: {
                enabled: midnightIndex >= 0,
                markerIndex: midnightIndex,
              },
              tooltip: {
                callbacks: {
                  label(context) {
                    const row = cycleRows[context.dataIndex];
                    if (!row) return "";
                    return formatRelativeChange(row.displayValue, 0);
                  },
                  afterBody(context) {
                    const row = cycleRows[context[0]?.dataIndex];
                    if (!row) return [];
                    return [
                      `Zyklus: 12:00 Vortag → 12:00 Tag`,
                      `Uhrzeit: ${row.label}:00`,
                      `Referenz: Vortag 12:00`,
                    ];
                  },
                },
              },
            },
          }),
        });
      }

      function renderLegacyHourlyChart(stats) {
        const hours = stats.hourly.map((row) => row.hour);
        const values = stats.hourly.map((row) => row.price);
        const ctx = document.getElementById("chart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels: hours,
            datasets: [
              {
                label: "Preisabweichung (€/l)",
                data: values,
                borderColor: "#0f766e",
                backgroundColor: "rgba(15, 118, 110, 0.15)",
                tension: 0.3,
                fill: true,
                pointRadius: 2,
              },
            ],
          },
          options: applyChartTheme({
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                title: { display: true, text: "Stunde" },
              },
              y: {
                title: { display: true, text: "Abweichung (€/l)" },
              },
            },
            plugins: {
              legend: {
                position: "bottom",
              },
            },
          }),
        });
      }

      async function loadHistoryChart() {
        const historyUrl = `${DATA_BASE}${stationPath(stationId)}/${fuel}/history.csv`;
        const rows = normalizeHistoryRows(await fetchCsv(historyUrl));
        if (!rows.length) {
          throw new Error("History unavailable");
        }
        document.getElementById("chart-sub").textContent =
          buildHistorySubtitle(rows);
        renderNoonHistoryChart(rows);
      }

      async function loadProfileChart() {
        const statsUrl = `${DATA_BASE}${stationPath(stationId)}/${fuel}.json`;
        const stats = await fetchJson(statsUrl);
        if (Array.isArray(stats?.cycle_hourly) && stats.cycle_hourly.length) {
          document.getElementById("chart-sub").textContent =
            buildCycleSubtitle();
          renderCycleReferenceChart(stats);
          return;
        }
        if (
          TankzeitStats.summaryFromStats(stats) &&
          Array.isArray(stats.hourly) &&
          stats.hourly.length
        ) {
          document.getElementById("chart-sub").textContent =
            buildReferenceSubtitle(stats);
          renderReferenceChart(stats);
          return;
        }

        document.getElementById("chart-sub").textContent =
          "Fallback: historische Abweichung vom Tagesmittel (altes Datenformat).";
        renderLegacyHourlyChart(stats);
      }

      async function loadChart() {
        if (!stationId) return;

        // Wait for Chart.js to be available (deferred loading)
        const waitForChart = () =>
          new Promise((resolve) => {
            if (typeof Chart !== "undefined") {
              resolve();
            } else {
              const check = setInterval(() => {
                if (typeof Chart !== "undefined") {
                  clearInterval(check);
                  resolve();
                }
              }, 50);
            }
          });

        await waitForChart();
        if (activeView === "history") {
          try {
            await loadHistoryChart();
            return;
          } catch (_error) {
            activeView = "profile";
            setButtonState();
            updateViewInUrl();
          }
        }
        await loadProfileChart();
      }

      loadChart().catch(() => {
        document.getElementById("chart-sub").textContent =
          "Chart konnte nicht geladen werden.";
      });

      DARK_MODE_MEDIA_QUERY.addEventListener?.("change", () => {
        refreshChartTheme();
      });
    </script>
    <script src="app-install-promo.js?v=20260409-app-promo-v12"></script>
  </body>
</html>
