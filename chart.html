<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Preisverlauf nach Stunde für eine Tankstelle."
    />
    <meta name="robots" content="noindex,follow" />
    <title>Tankzeit | Chart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="styles.css" as="style" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
    ></script>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand">
          <h1>Tankzeit</h1>
          <p>Preisänderung seit Vortag 12:00.</p>
        </div>
      </header>

      <section class="card chart-card">
        <div class="chart-actions">
          <a class="btn" id="maps-link" href="#" target="_blank" rel="noopener"
            >Zur Tankstelle</a
          >
        </div>
        <h2 class="chart-title" id="chart-title">Lade Chart...</h2>
        <canvas id="chart"></canvas>
        <p class="chart-sub" id="chart-sub"></p>
      </section>
    </main>

    <nav class="nav-bar" aria-label="Hauptnavigation">
      <a href="index.html" class="nav-item diesel">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z"
          />
        </svg>
        <span>Diesel</span>
      </a>
      <a href="e10.html" class="nav-item e10">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z"
          />
        </svg>
        <span>E10</span>
      </a>
      <a href="favoriten.html" class="nav-item">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
          />
        </svg>
        <span>Favoriten</span>
      </a>
      <a href="management.html" class="nav-item">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="10" width="4" height="11" />
          <rect x="10" y="5" width="4" height="16" />
          <rect x="17" y="8" width="4" height="13" />
        </svg>
        <span>Statistik</span>
      </a>
      <a href="info.html" class="nav-item">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4M12 8h.01" />
        </svg>
        <span>Info</span>
      </a>
    </nav>

    <script src="app-stats.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const stationId = params.get("id");
      const fuel = params.get("fuel") || "diesel";
      const name = params.get("name") || "Tankstelle";
      const lat = params.get("lat");
      const lng = params.get("lng");
      const DATA_BASE = "data2/";
      let chartInstance = null;
      const PRIOR_DAY_COLOR = {
        fill: "rgba(107, 114, 128, 0.2)",
        stroke: "#6b7280",
      };
      const SAME_DAY_COLOR = {
        fill: "rgba(37, 99, 235, 0.2)",
        stroke: "#2563eb",
      };
      const noonDividerPlugin = {
        id: "noonDivider",
        afterDatasetsDraw(chart, _args, options) {
          if (!options || options.enabled === false) return;
          const xScale = chart.scales?.x;
          const chartArea = chart.chartArea;
          if (!xScale || !chartArea || xScale.ticks.length < 13) return;
          const leftTick = xScale.getPixelForTick(11);
          const rightTick = xScale.getPixelForTick(12);
          const dividerX = (leftTick + rightTick) / 2;
          const { ctx } = chart;
          ctx.save();
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = "rgba(37, 99, 235, 0.38)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(dividerX, chartArea.top);
          ctx.lineTo(dividerX, chartArea.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(37, 99, 235, 0.82)";
          ctx.font = "12px Manrope, sans-serif";
          ctx.fillText("12:00", dividerX + 6, chartArea.top + 14);
          ctx.restore();
        },
      };

      const title = `${name} · ${fuel.toUpperCase()}`;
      document.getElementById("chart-title").textContent = title;
      document.getElementById("chart-sub").textContent =
        "Lade Preisänderung seit Vortag 12:00...";

      if (lat && lng) {
        const maps = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
        const link = document.getElementById("maps-link");
        link.href = maps;
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.json();
      }

      function buildReferenceSubtitle(stats) {
        const summary = TankzeitStats.summaryFromStats(stats);
        if (!summary) {
          return "Referenz ist durchgehend Vortag 12:00. Grau zeigt 00:00 bis 11:59, blau 12:00 bis 23:59. Positive Werte liegen über der Referenz, negative darunter; die y-Achse passt sich dem sichtbaren Bereich an.";
        }
        const parts = [];
        const dayCount = TankzeitStats.toNumber(
          summary.analysis_days ?? summary.days,
        );
        if (dayCount !== null) {
          parts.push(`${TankzeitStats.formatCount(dayCount)} Tage`);
        }
        parts.push("Referenz durchgehend Vortag 12:00");
        parts.push("grau 00:00 - 11:59, blau 12:00 - 23:59");
        parts.push("positive Werte = teurer, negative Werte = günstiger");
        parts.push("y-Achse nach sichtbarem Minimum und Maximum");
        return parts.join(" · ");
      }

      function sanitizeRelativeValue(valueInEuro) {
        const amount = Number(valueInEuro);
        if (!Number.isFinite(amount)) return 0;
        return amount;
      }

      function formatRelativeChange(valueInEuro) {
        const amount = sanitizeRelativeValue(valueInEuro);
        if (!Number.isFinite(amount)) return "-";
        if (Math.abs(amount) < 0.0005) return "auf Vortag-12:00-Niveau";
        return `${(Math.abs(amount) * 100).toFixed(1)} ct/l ${
          amount > 0 ? "teurer" : "günstiger"
        } als Vortag 12:00`;
      }

      function formatEuroTick(valueInEuro) {
        const amount = Number(valueInEuro);
        if (!Number.isFinite(amount)) return "-";
        return new Intl.NumberFormat("de-DE", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(amount);
      }

      function priorNoonShift(stats) {
        const daily = Array.isArray(stats?.daily) ? stats.daily : [];
        const shifts = daily
          .map((row) => Number(row?.noon_price) - Number(row?.prior_reference_price))
          .filter((value) => Number.isFinite(value));
        if (shifts.length) {
          return shifts.reduce((sum, value) => sum + value, 0) / shifts.length;
        }
        const summary = TankzeitStats.summaryFromStats(stats);
        if (!summary) return 0;
        const noonPrice = TankzeitStats.toNumber(
          summary.noon_price_avg ?? summary.noon_price_median,
        );
        const priorPrice = TankzeitStats.toNumber(
          summary.prior_reference_price_avg ?? summary.prior_reference_price_median,
        );
        if (noonPrice === null || priorPrice === null) return 0;
        return noonPrice - priorPrice;
      }

      function buildDisplaySeries(stats) {
        const shift = priorNoonShift(stats);
        const hourly = Array.isArray(stats?.hourly) ? stats.hourly : [];
        return hourly.map((row) => {
          const rawValue = Number(row?.price ?? 0) + (Number(row?.hour) >= 12 ? shift : 0);
          return {
            hour: Number(row?.hour ?? 0),
            rawValue,
            displayValue: sanitizeRelativeValue(rawValue),
          };
        });
      }

      function computeSeriesDomain(values) {
        const finiteValues = values.filter((value) => Number.isFinite(value));
        if (!finiteValues.length) {
          return { min: -0.05, max: 0.05 };
        }
        let min = Math.min(...finiteValues);
        let max = Math.max(...finiteValues);
        if (Math.abs(max - min) < 0.0005) {
          const pad = Math.max(0.01, Math.abs(max || 0.01) * 0.2);
          return { min: min - pad, max: max + pad };
        }
        const pad = Math.max(0.01, (max - min) * 0.12);
        return { min: min - pad, max: max + pad };
      }

      function referenceTooltipLines(row) {
        if (!row) return [];
        return ["Referenz: Vortag 12:00"];
      }

      function renderReferenceChart(stats) {
        const displaySeries = buildDisplaySeries(stats);
        const labels = displaySeries.map((row) => `${String(row.hour).padStart(2, "0")}:00`);
        const priorDayValues = displaySeries.map((row, index) =>
          index < 12 ? row.displayValue : null,
        );
        const sameDayValues = displaySeries.map((row, index) =>
          index >= 12 ? row.displayValue : null,
        );
        const domain = computeSeriesDomain(displaySeries.map((row) => row.displayValue));
        const ctx = document.getElementById("chart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          plugins: [noonDividerPlugin],
          data: {
            labels,
            datasets: [
              {
                label: "00:00 - 11:59",
                data: priorDayValues,
                borderColor: PRIOR_DAY_COLOR.stroke,
                backgroundColor: PRIOR_DAY_COLOR.stroke,
                borderWidth: 2.4,
                pointRadius: 1.8,
                pointHoverRadius: 4,
                pointBackgroundColor: PRIOR_DAY_COLOR.stroke,
                pointBorderColor: PRIOR_DAY_COLOR.stroke,
                stepped: "after",
                tension: 0,
                spanGaps: false,
                fill: false,
              },
              {
                label: "12:00 - 23:59",
                data: sameDayValues,
                borderColor: SAME_DAY_COLOR.stroke,
                backgroundColor: SAME_DAY_COLOR.stroke,
                borderWidth: 2.4,
                pointRadius: 1.8,
                pointHoverRadius: 4,
                pointBackgroundColor: SAME_DAY_COLOR.stroke,
                pointBorderColor: SAME_DAY_COLOR.stroke,
                stepped: "after",
                tension: 0,
                spanGaps: false,
                fill: false,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: "Stunde",
                },
              },
              y: {
                min: domain.min,
                max: domain.max,
                ticks: {
                  callback(value) {
                    return formatEuroTick(value);
                  },
                },
                grid: {
                  color(context) {
                    return context.tick.value === 0
                      ? "rgba(37, 99, 235, 0.28)"
                      : "rgba(0, 0, 0, 0.08)";
                  },
                },
                title: {
                  display: true,
                  text: "Preisänderung seit Vortag 12:00 (€/l)",
                },
              },
            },
            plugins: {
              legend: {
                position: "bottom",
              },
              noonDivider: {
                enabled: labels.length >= 24,
              },
              tooltip: {
                callbacks: {
                  label(context) {
                    const row = displaySeries[context.dataIndex];
                    if (!row) return "";
                    return formatRelativeChange(row.displayValue);
                  },
                  afterBody(items) {
                    const row = displaySeries[items[0].dataIndex];
                    return referenceTooltipLines(row);
                  },
                },
              },
            },
          },
        });
      }

      function renderLegacyHourlyChart(stats) {
        const hours = stats.hourly.map((row) => row.hour);
        const values = stats.hourly.map((row) => row.price);
        const ctx = document.getElementById("chart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels: hours,
            datasets: [
              {
                label: "Preisabweichung (€/l)",
                data: values,
                borderColor: "#0f766e",
                backgroundColor: "rgba(15, 118, 110, 0.15)",
                tension: 0.3,
                fill: true,
                pointRadius: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                title: { display: true, text: "Stunde" },
              },
              y: {
                title: { display: true, text: "Abweichung (€/l)" },
              },
            },
            plugins: {
              legend: {
                position: "bottom",
              },
            },
          },
        });
      }

      async function loadChart() {
        if (!stationId) return;

        // Wait for Chart.js to be available (deferred loading)
        const waitForChart = () =>
          new Promise((resolve) => {
            if (typeof Chart !== "undefined") {
              resolve();
            } else {
              const check = setInterval(() => {
                if (typeof Chart !== "undefined") {
                  clearInterval(check);
                  resolve();
                }
              }, 50);
            }
          });

        await waitForChart();

        const statsUrl = `${DATA_BASE}${stationId.split("-").join("/")}/${fuel}.json`;
        const stats = await fetchJson(statsUrl);
        if (TankzeitStats.summaryFromStats(stats) && Array.isArray(stats.hourly) && stats.hourly.length) {
          document.getElementById("chart-sub").textContent =
            buildReferenceSubtitle(stats);
          renderReferenceChart(stats);
          return;
        }

        document.getElementById("chart-sub").textContent =
          "Fallback: historische Abweichung vom Tagesmittel (altes Datenformat).";
        renderLegacyHourlyChart(stats);
      }

      loadChart().catch(() => {
        document.getElementById("chart-sub").textContent =
          "Chart konnte nicht geladen werden.";
      });
    </script>
  </body>
</html>
