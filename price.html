  <body class="station-page">
    <main class="station-shell breakdown-shell">
      <a class="legal-back" id="back-link" href="index.html">← Zurück</a>

      <section class="station-hero breakdown-hero">
        <p class="legal-kicker" id="breakdown-meta">Preisaufschlüsselung</p>
        <h1 id="breakdown-title">Preis wird geladen</h1>
      </section>

      <section class="legal-card breakdown-card" id="breakdown-card">
        <div class="breakdown-stack">
          <div class="breakdown-step breakdown-step-emphasis">
            <span>Bruttopreis</span>
            <strong id="gross-price">-</strong>
          </div>
          <div class="breakdown-operator">−</div>
          <div class="breakdown-step">
            <span>MwSt. 19 %</span>
            <strong id="vat-price">-</strong>
          </div>
          <div class="breakdown-operator">=</div>
          <div class="breakdown-step breakdown-step-emphasis">
            <span>Netto Preis</span>
            <strong id="net-price">-</strong>
          </div>
          <div class="breakdown-operator">−</div>
          <div class="breakdown-step">
            <span>Steuern und Abgaben inkl. CO2</span>
            <strong id="other-taxes-price">-</strong>
          </div>
          <div class="breakdown-rebate-note" id="rebate-note" hidden></div>
          <div class="breakdown-operator">=</div>
          <div class="breakdown-step breakdown-step-result" id="sale-step">
            <span>Verkaufspreis</span>
            <strong id="sale-price">-</strong>
          </div>
          <div id="brent-steps"></div>
        </div>
      </section>
    </main>

    <nav class="nav-bar" aria-label="Hauptnavigation">
      <a href="index.html" class="nav-item diesel" id="nav-diesel">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z"
          />
        </svg>
        <span>Diesel</span>
      </a>
      <a href="e10.html" class="nav-item e10" id="nav-e10">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z"
          />
        </svg>
        <span>E10</span>

      <a href="favoriten.html" class="nav-item">
        <svg viewBox="0 0 24 24">

            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"

        <svg viewBox="0 0 24 24">

    <script src="web-config.js?v=20260725-simple-v1"></script>
    <script src="fuel-breakdown.js?v=20260501-energy-tax-rebate"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const fuel = (params.get("fuel") || "diesel").toLowerCase();
      const fuelConfig = TankzeitFuelBreakdown.fuelConfig(fuel);
      const price = TankzeitFuelBreakdown.toNumber(params.get("price"));
      const priceDate = params.get("date") || new Date();
      const stationId = params.get("id") || "";
      const stationName = params.get("name") || "Tankstelle";
      const stationBrand = params.get("brand") || "";
      const calculation = TankzeitFuelBreakdown.calculate(fuel, price, priceDate);

      function safeInternalHref(value, fallback) {
        const candidate = String(value || "").trim();
        if (!candidate) return fallback;
        if (/^[a-z]+:/i.test(candidate) || candidate.startsWith("//")) {
          return fallback;
        }
        if (!/^[./a-zA-Z0-9_-]+(?:\.html)?$/.test(candidate)) {
          return fallback;
        }
        return candidate;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function setActiveFuelNav() {
        const activeId =
          fuelConfig.key === "diesel"
            ? "nav-diesel"
            : fuelConfig.key === "e10"
              ? "nav-e10"
              : null;
        if (!activeId) return;
        const activeLink = document.getElementById(activeId);
        if (!activeLink) return;
        activeLink.classList.add("active");
        activeLink.setAttribute("aria-current", "page");
      }

      async function fetchJson(url) {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }
        return response.json();
      }

      function formatShortDate(value) {
        if (!value) return "";
        const [year, month, day] = String(value).split("-");
        if (!year || !month || !day) return String(value);
        return `${day}.${month}.${year}`;
      }

      async function renderBrentSupplement(salePrice) {
        const brentStepsEl = document.getElementById("brent-steps");
        try {
          const brent = await fetchJson(
            window.TankzeitWebConfig?.brentUrl || "data/brent.json",
          );
          const brentPerLiter = TankzeitFuelBreakdown.toNumber(
            brent &&
              (brent.brent_eur_per_crude_liter ?? brent.brent_eur_per_liter),
          );
          if (brentPerLiter === null) return;

          const operatingDelta = salePrice - brentPerLiter;
          const brentDateText = formatShortDate(brent.brent_as_of);
          const crudeLabel = brentDateText
            ? `Rohölpreis ${brentDateText}`
            : "Rohölpreis";
          const operatorLabel = `Betriebskosten und Gewinn von ${stationBrand || stationName}`;

          brentStepsEl.innerHTML = `
            <div class="breakdown-operator">−</div>
            <div class="breakdown-step">
              <span>${escapeHtml(crudeLabel)}</span>
              <strong>${TankzeitFuelBreakdown.formatEuroPerLiter(brentPerLiter)}</strong>
            </div>
            <div class="breakdown-operator">=</div>
            <div class="breakdown-step breakdown-step-result">
              <span>${escapeHtml(operatorLabel)}</span>
              <strong>${TankzeitFuelBreakdown.formatEuroPerLiter(operatingDelta)}</strong>
            </div>
          `;
        } catch (_error) {
          brentStepsEl.innerHTML = "";
        }
      }

      function render() {
        setActiveFuelNav();

        const fallbackBackHref = safeInternalHref(
          fuelConfig.defaultBackPath,
          "index.html",
        );
        const backHref = safeInternalHref(params.get("back"), fallbackBackHref);
        const backLabel =
          params.get("backLabel") || fuelConfig.defaultBackLabel || "Zurück";
        const backLink = document.getElementById("back-link");
        backLink.href = backHref;
        backLink.textContent = `← ${backLabel}`;

        document.getElementById("breakdown-title").textContent =
          `${stationName} · ${fuelConfig.label}`;
        document.getElementById("breakdown-meta").textContent =
          stationBrand && stationBrand !== stationName
            ? `${stationBrand} · Preisaufschlüsselung`
            : "Preisaufschlüsselung";
        document.title = `Tankzeit | ${stationName} · ${fuelConfig.label}`;

        if (!calculation) {
          document.getElementById("breakdown-card").innerHTML =
            '<div class="breakdown-empty">Preis fehlt</div>';
          return;
        }

        const netPrice = calculation.grossPrice - calculation.vat;
        const otherTaxes = calculation.regulated - calculation.vat;

        document.getElementById("gross-price").textContent =
          TankzeitFuelBreakdown.formatEuroPerLiter(calculation.grossPrice);
        document.getElementById("vat-price").textContent =
          TankzeitFuelBreakdown.formatEuroPerLiter(calculation.vat);
        document.getElementById("net-price").textContent =
          TankzeitFuelBreakdown.formatEuroPerLiter(netPrice);
        document.getElementById("other-taxes-price").textContent =
          TankzeitFuelBreakdown.formatEuroPerLiter(otherTaxes);
        document.getElementById("sale-price").textContent =
          TankzeitFuelBreakdown.formatEuroPerLiter(calculation.market);
        const rebateNoteEl = document.getElementById("rebate-note");
        if (rebateNoteEl && calculation.temporaryEnergyTaxRebate) {
          const rebate = calculation.temporaryEnergyTaxRebate;
          rebateNoteEl.hidden = false;
          rebateNoteEl.innerHTML = `
            <span>Tankrabatt ${formatShortDate(rebate.startDate)}-${formatShortDate(rebate.endDate)}</span>
            <strong>−${TankzeitFuelBreakdown.formatEuroPerLiter(rebate.reductionPerLiter)}</strong>
          `;
        }
        void renderBrentSupplement(calculation.market);
      }

      render();
    </script>
    <script src="app-install-promo.js?v=20260725-app-promo-v13"></script>
  </body>
</html>
