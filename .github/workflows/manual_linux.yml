# This is a basic workflow that is manually triggered on uses linux

name: Manual data update

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      TK_USER: ${{ secrets.TK_USER }}
      TK_PASS: ${{ secrets.TK_PASS }}
    steps:
      - name: Checkout latest version
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Calibrate reaction timing
        run: python scripts/calibrate_reaction_timing.py --days 5 --max-events-per-fuel 25000
      - name: Upload reaction calibration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reaction-timing-calibration
          path: |
            output/reaction_timing_calibration/reaction_timing_summary.csv
            output/reaction_timing_calibration/reaction_timing_report.md
