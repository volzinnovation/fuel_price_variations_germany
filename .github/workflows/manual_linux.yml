# This is a basic workflow that is manually triggered on uses linux

name: Manual data update

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  leader-follower-analysis:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      TK_USER: ${{ secrets.TK_USER }}
      TK_PASS: ${{ secrets.TK_PASS }}
    steps:
      - name: Checkout latest version
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install --require-hashes -r requirements.lock
      - name: Run leader follower analysis
        run: >-
          python scripts/analyze_leader_follower_pairs.py
          --days 30
          --output-dir output/leader_follower_30d
      - name: Publish report summary
        run: cat output/leader_follower_30d/leader_follower_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload leader follower artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leader-follower-30d
          path: |
            output/leader_follower_30d
