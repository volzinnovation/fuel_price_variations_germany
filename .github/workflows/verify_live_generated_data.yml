name: Verify live generated data

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Berlin-local snapshot date (YYYY-MM-DD). Defaults to yesterday."
        required: false
        type: string
      origin:
        description: "Site origin to verify."
        required: false
        default: "https://tankzeit.de"
        type: string
      live_samples_per_fuel:
        description: "How many delayed live station payloads to verify per fuel."
        required: false
        default: "10"
        type: string
      wait_live_seconds:
        description: "How long to wait for live assets to catch up."
        required: false
        default: "1200"
        type: string
  workflow_run:
    workflows: ["Daily data update"]
    types:
      - completed

jobs:
  verify-live:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - name: Checkout latest version
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install --require-hashes -r requirements.lock
      - name: Verify deployed data against checked-in artifacts
        run: |
          ORIGIN="${{ github.event.inputs.origin }}"
          if [ -z "$ORIGIN" ]; then
            ORIGIN="https://tankzeit.de"
          fi

          DATE_ARG=()
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG=(--date "${{ github.event.inputs.date }}")
          fi

          WAIT_SECONDS="${{ github.event.inputs.wait_live_seconds }}"
          if [ -z "$WAIT_SECONDS" ]; then
            WAIT_SECONDS="1200"
          fi

          LIVE_SAMPLES="${{ github.event.inputs.live_samples_per_fuel }}"
          if [ -z "$LIVE_SAMPLES" ]; then
            LIVE_SAMPLES="10"
          fi

          python scripts/verify_live_generated_data.py \
            --origin "$ORIGIN" \
            --wait-live-seconds "$WAIT_SECONDS" \
            --live-samples-per-fuel "$LIVE_SAMPLES" \
            "${DATE_ARG[@]}"
