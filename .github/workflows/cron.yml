# This is the schedule workflow

name: Daily data update

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  schedule:
  - cron: '5 0 * * *'  # 00:05 UTC (GitHub Actions schedules use UTC)
  workflow_dispatch:

concurrency:
  group: master-data-writer
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      TK_USER: ${{ secrets.TK_USER }}
      TK_PASS: ${{ secrets.TK_PASS }}
    steps:
      - name: Checkout latest version
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Wait for yesterday raw price day
        run: |
          python - <<'PY'
          import os
          import time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import certifi
          import requests

          from scripts.generate_data import TANKER_BASE, _data_path

          wait_minutes = 180
          interval_seconds = 300
          berlin_today = datetime.now(ZoneInfo("Europe/Berlin")).date()
          target_day = berlin_today - timedelta(days=1)
          url = f"{TANKER_BASE}/{_data_path('prices', target_day)}"
          auth = None
          user = os.environ.get("TK_USER")
          password = os.environ.get("TK_PASS")
          if user and password:
              auth = (user, password)

          attempts = max(1, wait_minutes * 60 // interval_seconds)
          for attempt in range(1, attempts + 1):
              response = requests.get(
                  url,
                  timeout=120,
                  verify=certifi.where(),
                  auth=auth,
                  stream=True,
              )
              status_code = response.status_code
              response.close()
              if status_code == 200:
                  print(f"{target_day:%Y-%m-%d} raw price CSV is available.")
                  break
              if status_code != 404:
                  raise SystemExit(f"Unexpected HTTP {status_code} while waiting for {url}")
              if attempt == attempts:
                  raise SystemExit(
                      f"{target_day:%Y-%m-%d} raw price CSV still unavailable after "
                      f"{wait_minutes} minutes: {url}"
                  )
              print(
                  f"{target_day:%Y-%m-%d} raw price CSV not published yet "
                  f"(attempt {attempt}/{attempts}); retrying in {interval_seconds // 60} minutes."
              )
              time.sleep(interval_seconds)
          PY
      - name: Generate data
        run: python scripts/generate_data.py --analysis-days 1
      - name: Rebuild station pages
        run: python scripts/build_site.py
      - name: Configure git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
      - name: Commit data changes
        run: |
          git add data data2 station sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily data update"
          git fetch origin master
          git rebase origin/master
          git push origin master
