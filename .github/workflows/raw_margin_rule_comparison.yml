name: Raw margin rule comparison

on:
  workflow_dispatch:
    inputs:
      warmup_start:
        description: First raw day used to warm up station price state
        required: true
        default: "2026-02-22"
      start_date:
        description: First chart day
        required: true
        default: "2026-03-01"
      cutover_date:
        description: Vertical comparison date
        required: true
        default: "2026-04-01"
      end_date:
        description: Last chart day
        required: true
        default: "2026-04-30"

jobs:
  build-raw-margin-comparison:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      TK_USER: ${{ secrets.TK_USER }}
      TK_PASS: ${{ secrets.TK_PASS }}
    steps:
      - name: Checkout latest version
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate raw Diesel margin comparison
        run: >-
          python scripts/generate_raw_margin_rule_comparison.py
          --warmup-start "${{ inputs.warmup_start }}"
          --start-date "${{ inputs.start_date }}"
          --cutover-date "${{ inputs.cutover_date }}"
          --end-date "${{ inputs.end_date }}"

      - name: Publish summary
        run: cat output/raw_margin_rule_comparison/diesel_betriebskosten_marge_rohdatenvergleich.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diesel-betriebskosten-marge-rohdatenvergleich
          path: |
            output/raw_margin_rule_comparison/diesel_betriebskosten_marge_rohdatenvergleich.csv
            output/raw_margin_rule_comparison/diesel_betriebskosten_marge_rohdatenvergleich.png
            output/raw_margin_rule_comparison/diesel_betriebskosten_marge_rohdatenvergleich.md
