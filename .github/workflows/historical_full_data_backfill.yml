name: Historical full data backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First snapshot day to regenerate
        required: true
        default: "2026-04-02"
      end_date:
        description: Last snapshot day to regenerate
        required: true
        default: "2026-04-05"
      analysis_days:
        description: Number of completed days to aggregate per snapshot
        required: true
        default: "2"
      update_latest_files:
        description: Also update data/noon.csv and data/stations.json
        required: true
        default: "true"

concurrency:
  group: master-data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill-full-data:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      TK_USER: ${{ secrets.TK_USER }}
      TK_PASS: ${{ secrets.TK_PASS }}
    steps:
      - name: Checkout latest version
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Backfill noon reference snapshots
        run: |
          BACKFILL_START=$(python - <<'PY'
          from datetime import date, timedelta
          start = date.fromisoformat("${{ inputs.start_date }}")
          print((start - timedelta(days=1)).isoformat())
          PY
          )
          EXTRA_ARGS=()
          if [ "${{ inputs.update_latest_files }}" != "true" ]; then
            EXTRA_ARGS+=(--skip-latest-output)
          fi
          python scripts/generate_noon_price_backfill.py \
            --start-date "$BACKFILL_START" \
            --end-date "${{ inputs.end_date }}" \
            "${EXTRA_ARGS[@]}"

      - name: Regenerate station and management snapshots
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          import subprocess
          import sys

          start = date.fromisoformat("${{ inputs.start_date }}")
          end = date.fromisoformat("${{ inputs.end_date }}")
          analysis_days = int("${{ inputs.analysis_days }}")

          if end < start:
              raise SystemExit("end_date must be on or after start_date")

          current = start
          while current <= end:
              run_day = current + timedelta(days=1)
              cmd = [
                  sys.executable,
                  "scripts/generate_data.py",
                  "--analysis-days",
                  str(analysis_days),
                  "--today",
                  run_day.isoformat(),
              ]
              print("Running", " ".join(cmd), flush=True)
              subprocess.run(cmd, check=True)
              current += timedelta(days=1)
          PY

      - name: Normalize latest tracked files
        if: ${{ inputs.update_latest_files != 'true' }}
        run: git restore data/noon.csv data/stations.json

      - name: Configure git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      - name: Commit regenerated data
        run: |
          git add data2
          if [ "${{ inputs.update_latest_files }}" = "true" ]; then
            git add data/noon.csv data/stations.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Backfill full data ${{ inputs.start_date }} to ${{ inputs.end_date }}"
          git fetch origin master
          git rebase origin/master
          git push origin master
