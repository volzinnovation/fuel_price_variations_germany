name: Daily midnight snapshot

on:
  schedule:
  - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-midnight-snapshot:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      TK_USER: ${{ secrets.TK_USER }}
      TK_PASS: ${{ secrets.TK_PASS }}
    steps:
      - name: Checkout latest version
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate midnight.csv
        run: python scripts/generate_midnight_csv.py

      - name: Configure git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      - name: Commit midnight snapshot
        run: |
          git add data/midnight.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily midnight snapshot"
          git push origin master
