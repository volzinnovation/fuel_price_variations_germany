<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Deine gespeicherten Favoriten-Tankstellen mit aktuellen Preisen."
    />
    <meta name="robots" content="noindex,follow" />
    <title>Tankzeit | Favoriten</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="styles.css" as="style" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand">
          <h1>Favoriten</h1>
          <p>Deine gespeicherten Tankstellen im Überblick.</p>
        </div>
      </header>

      <div id="status" class="status"></div>

      <section class="card">
        <table class="table">
          <thead>
            <tr>
              <th>Name</th>
              <th>E10 €/l</th>
              <th>Diesel €/l</th>
              <th>E10 Mittag / Senkungen</th>
              <th>E10 Tagesminimum</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="favorites">
            <tr>
              <td colspan="6">Favoriten werden geladen...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <nav class="nav-bar" aria-label="Hauptnavigation">
      <a href="index.html" class="nav-item diesel">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z"
          />
        </svg>
        <span>Diesel</span>
      </a>
      <a href="e10.html" class="nav-item e10">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22s8-4 8-10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 6 8 10 8 10z"
          />
        </svg>
        <span>E10</span>
      </a>
      <a href="favoriten.html" class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
          />
        </svg>
        <span>Favoriten</span>
      </a>
      <a href="management.html" class="nav-item">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="10" width="4" height="11" />
          <rect x="10" y="5" width="4" height="16" />
          <rect x="17" y="8" width="4" height="13" />
        </svg>
        <span>Statistik</span>
      </a>
      <a href="info.html" class="nav-item">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4M12 8h.01" />
        </svg>
        <span>Info</span>
      </a>
    </nav>

    <script src="app-stats.js"></script>
    <script>
      const DATA_BASE = "data2/";
      const TANKERKOENIG_APOLOGY =
        "Entschuldigung, Tankerkoenig ist derzeit nicht erreichbar. Bitte versuche es spaeter erneut.";
      const statusEl = document.getElementById("status");
      const favoritesEl = document.getElementById("favorites");
      const ids = JSON.parse(localStorage.getItem("ids")) || [];
      const fav = JSON.parse(localStorage.getItem("fav")) || [];

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `status ${type === "error" ? "error" : ""}`;
        statusEl.style.display = "block";
      }

      function clearStatus() {
        statusEl.style.display = "none";
      }

      function removeAndStore(id) {
        const index = ids.indexOf(id);
        if (index >= 0) {
          ids.splice(index, 1);
          fav.splice(index, 1);
          localStorage.setItem("fav", JSON.stringify(fav));
          localStorage.setItem("ids", JSON.stringify(ids));
          render();
        }
      }

      function isTankerkoenigRequest(url) {
        return url.includes("tankerkoenig.de");
      }

      async function fetchJson(url) {
        let response;
        try {
          response = await fetch(url);
        } catch (err) {
          if (isTankerkoenigRequest(url)) {
            throw new Error(TANKERKOENIG_APOLOGY);
          }
          throw err;
        }
        if (!response.ok) {
          if (isTankerkoenigRequest(url)) {
            throw new Error(TANKERKOENIG_APOLOGY);
          }
          throw new Error(`Request failed: ${response.status}`);
        }
        return response.json();
      }

      async function loadPrices() {
        if (!ids.length) {
          favoritesEl.innerHTML =
            "<tr><td colspan='6'>Keine Favoriten gespeichert.</td></tr>";
          setStatus(
            "Noch keine Favoriten. Füge welche auf der Startseite hinzu.",
          );
          return;
        }

        const url = `https://creativecommons.tankerkoenig.de/json/prices.php?ids=${ids.join(",")}&apikey=fe8673d1-47be-1156-77e4-040e06cb785c`;
        try {
          const prices = await fetchJson(url);
          await Promise.allSettled(
            ids.map(async (id) => {
              const statsUrl = `${DATA_BASE}${id.split("-").join("/")}/e10.json`;
              const stats = await fetchJson(statsUrl);
              const profile = document.getElementById(`${id}-profile`);
              const minimum = document.getElementById(`${id}-minimum`);
              if (profile) {
                const station = fav.find((f) => f.id === id) || {};
                const stationName = encodeURIComponent(
                  station.name || "Tankstelle",
                );
                const stationLat = station.lat || "";
                const stationLng = station.lng || "";
                profile.innerHTML = `<a href="chart.html?id=${id}&fuel=e10&name=${stationName}&lat=${stationLat}&lng=${stationLng}">${TankzeitStats.profileText(stats, "Details")}</a>`;
              }
              if (minimum) {
                minimum.textContent = TankzeitStats.minimumText(
                  stats,
                  stats.text || "-",
                );
              }
            }),
          );

          ids.forEach((id) => {
            const e10 = document.getElementById(`${id}-e10`);
            const diesel = document.getElementById(`${id}-diesel`);
            if (!prices.prices || !prices.prices[id]) return;
            const entry = prices.prices[id];
            e10.textContent =
              entry.status === "closed" ? "- (Geschlossen)" : entry.e10;
            diesel.textContent = entry.status === "closed" ? "-" : entry.diesel;
          });
          clearStatus();
        } catch (err) {
          const message =
            err && err.message === TANKERKOENIG_APOLOGY
              ? TANKERKOENIG_APOLOGY
              : "Fehler beim Laden der Favoriten.";
          setStatus(message, "error");
        }
      }

      function render() {
        if (!fav.length) {
          favoritesEl.innerHTML =
            "<tr><td colspan='6'>Keine Favoriten gespeichert.</td></tr>";
          return;
        }
        favoritesEl.innerHTML = fav
          .map(
            (station) => `
          <tr>
            <td data-label="Name"><a href="https://www.google.com/maps/search/?api=1&query=${station.lat},${station.lng}" target="_blank" rel="noopener">${station.name}</a></td>
            <td data-label="E10" id="${station.id}-e10">...</td>
            <td data-label="Diesel" id="${station.id}-diesel">...</td>
            <td data-label="E10 Mittag / Senkungen" id="${station.id}-profile"><a href="chart.html?id=${station.id}&fuel=e10&name=${encodeURIComponent(station.name)}&lat=${station.lat}&lng=${station.lng}">Details</a></td>
            <td data-label="E10 Tagesminimum" id="${station.id}-minimum">-</td>
            <td><button class="remove" data-id="${station.id}">🗑️</button></td>
          </tr>
        `,
          )
          .join("");

        document.querySelectorAll(".remove").forEach((btn) => {
          btn.addEventListener("click", () => removeAndStore(btn.dataset.id));
        });

        loadPrices();
      }

      render();
    </script>
  </body>
</html>
