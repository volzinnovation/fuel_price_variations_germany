              <th></th>
            </tr>
          </thead>

            <tr>
              <td colspan="6">Favoriten werden geladen...</td>
            </tr>
          </tbody>
        </table>
      </section>

    <script src="web-config.js?v=20260725-simple-v1"></script>
    <script src="app-stats.js"></script>

    <script>
      const DATA_BASE = window.TankzeitWebConfig?.dataBase || "data2/";
      const TANKERKOENIG_APOLOGY =
        "Entschuldigung, Tankerkönig ist derzeit nicht erreichbar. Bitte versuche es später erneut.";
      const NO_LIVE_PRICE_TEXT = "Livepreis nicht verfügbar";
      const FALLBACK_STATUS_MESSAGE =
        "Livepreise sind derzeit nicht verfügbar. Tankzeit und Detailansichten bleiben verfügbar.";
      const statusEl = document.getElementById("status");
      const favoritesEl = document.getElementById("favorites");
      const e10PriceHeadingEl = document.getElementById("e10-price-heading");
      const dieselPriceHeadingEl = document.getElementById(
        "diesel-price-heading",
      );
      const ids = JSON.parse(localStorage.getItem("ids")) || [];
      const fav = JSON.parse(localStorage.getItem("fav")) || [];
      let livePricesAvailable = true;

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function hrefForHtml(url) {
        return String(url).replaceAll("&", "&amp;");
      }

      function mapsUrl(lat, lng) {
        return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
      }

      function chartUrl(stationId, stationName, lat, lng) {
        return `chart.html?id=${stationId}&fuel=e10&name=${encodeURIComponent(stationName)}&lat=${lat}&lng=${lng}`;
      }

      function favoriteById(id) {
        return fav.find((entry) => entry.id === id) || {};
      }

      function breakdownUrl(station, fuel, price, date) {
        return TankzeitFuelBreakdown.buildBreakdownUrl({
          id: station.id,
          fuel,
          name: station.name || "Tankstelle",
          brand: station.brand || "",
          price,
          date,
          lat: station.lat || "",
          lng: station.lng || "",
          backPath: "favoriten.html",
          backLabel: "Zurück zu Favoriten",
        });
      }

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `status ${type === "error" ? "error" : ""}`;
        statusEl.style.display = "block";
      }

      function clearStatus() {
        statusEl.style.display = "none";
      }

      function setLivePriceAvailability(isAvailable) {
        livePricesAvailable = isAvailable;
        if (e10PriceHeadingEl) {
          e10PriceHeadingEl.textContent = isAvailable ? "E10 €/l" : "E10";
        }
        if (dieselPriceHeadingEl) {
          dieselPriceHeadingEl.textContent = isAvailable
            ? "Diesel €/l"
            : "Diesel";
        }
      }

      function removeAndStore(id) {
        const index = ids.indexOf(id);
        if (index >= 0) {
          ids.splice(index, 1);
          fav.splice(index, 1);
          localStorage.setItem("fav", JSON.stringify(fav));
          localStorage.setItem("ids", JSON.stringify(ids));
          render();
        }
      }

      function isTankerkoenigRequest(url) {
        return url.includes("tankerkoenig.de");
      }

      async function fetchJson(url) {
        let response;
        try {
          response = await fetch(url);
        } catch (err) {
          if (isTankerkoenigRequest(url)) {
            throw new Error(TANKERKOENIG_APOLOGY);
          }
          throw err;
        }
        if (!response.ok) {
          if (isTankerkoenigRequest(url)) {
            throw new Error(TANKERKOENIG_APOLOGY);
          }
          throw new Error(`Request failed: ${response.status}`);
        }
        const payload = await response.json();
        if (isTankerkoenigRequest(url) && payload && payload.ok === false) {
          throw new Error(TANKERKOENIG_APOLOGY);
        }
        return payload;
      }

      function renderUnavailableFavoritePrices() {
        ids.forEach((id) => {
          const e10 = document.getElementById(`${id}-e10`);
          const diesel = document.getElementById(`${id}-diesel`);
          if (e10) e10.textContent = NO_LIVE_PRICE_TEXT;
          if (diesel) diesel.textContent = NO_LIVE_PRICE_TEXT;
        });
      }

      async function loadPrices() {
        if (!ids.length) {
          favoritesEl.innerHTML =
            "<tr><td colspan='6'>Keine Favoriten gespeichert.</td></tr>";
          setStatus(
            "Noch keine Favoriten. Füge welche auf der Startseite hinzu.",
          );
          return;
        }

        const url = `https://creativecommons.tankerkoenig.de/json/prices.php?ids=${ids.join(",")}&apikey=fe8673d1-47be-1156-77e4-040e06cb785c`;
        await Promise.allSettled(
          ids.map(async (id) => {
            const statsUrl = `${DATA_BASE}${id.split("-").join("/")}/e10.json`;
            const stats = await fetchJson(statsUrl);
            const profile = document.getElementById(`${id}-profile`);
            const minimum = document.getElementById(`${id}-minimum`);
            if (profile) {
              const station = fav.find((f) => f.id === id) || {};
              const stationName = station.name || "Tankstelle";
              const detailsHref = hrefForHtml(
                chartUrl(id, stationName, station.lat || "", station.lng || ""),
              );
              profile.innerHTML = `<a href="${detailsHref}">${escapeHtml(TankzeitStats.profileText(stats, "Details"))}</a>`;
            }
            if (minimum) {
              minimum.textContent = TankzeitStats.relativeMinimumText(
                stats,
                stats.text || "-",
              );
            }
          }),
        );

        try {
          const prices = await fetchJson(url);
          setLivePriceAvailability(true);

          ids.forEach((id) => {
            const e10 = document.getElementById(`${id}-e10`);
            const diesel = document.getElementById(`${id}-diesel`);
            if (!e10 || !diesel) return;
            e10.textContent = NO_LIVE_PRICE_TEXT;
            diesel.textContent = NO_LIVE_PRICE_TEXT;
            if (!prices.prices || !prices.prices[id]) return;
            const entry = prices.prices[id];
            const station = favoriteById(id);
            if (entry.status === "closed") {
              e10.textContent = "- (Geschlossen)";
              diesel.textContent = "-";
              return;
            }
            const priceDate = new Date().toISOString();
            e10.innerHTML = `<a class="price-link" href="${hrefForHtml(
              breakdownUrl(station, "e10", entry.e10, priceDate),
            )}">${escapeHtml(String(entry.e10))} €/l</a>`;
            diesel.innerHTML = `<a class="price-link" href="${hrefForHtml(
              breakdownUrl(station, "diesel", entry.diesel, priceDate),
            )}">${escapeHtml(String(entry.diesel))} €/l</a>`;
          });
          clearStatus();
        } catch (err) {
          if (err && err.message === TANKERKOENIG_APOLOGY) {
            setLivePriceAvailability(false);
            renderUnavailableFavoritePrices();
            setStatus(FALLBACK_STATUS_MESSAGE);
            return;
          }
          setStatus("Fehler beim Laden der Favoriten.", "error");
        }
      }

      function render() {
        if (!fav.length) {
          favoritesEl.innerHTML =
            "<tr><td colspan='6'>Keine Favoriten gespeichert.</td></tr>";
          return;
        }
        favoritesEl.innerHTML = fav
          .map(
            (station) => {
              const mapsHref = hrefForHtml(mapsUrl(station.lat, station.lng));
              const detailsHref = hrefForHtml(
                chartUrl(station.id, station.name, station.lat, station.lng),
              );
              return `
          <tr>
            <td data-label="Name"><a href="${mapsHref}" target="_blank" rel="noopener">${escapeHtml(station.name)}</a></td>
            <td data-label="E10" id="${station.id}-e10">...</td>
            <td data-label="Diesel" id="${station.id}-diesel">...</td>
            <td data-label="E10 Mittag / Senkungen" id="${station.id}-profile"><a href="${detailsHref}">Details</a></td>
            <td data-label="Tankzeit" id="${station.id}-minimum">-</td>
            <td><button class="remove" data-id="${station.id}">🗑️</button></td>
          </tr>
        `;
            },
          )
          .join("");

        document.querySelectorAll(".remove").forEach((btn) => {
          btn.addEventListener("click", () => removeAndStore(btn.dataset.id));
        });

        loadPrices();
      }

      setLivePriceAvailability(true);
      render();
    </script>
