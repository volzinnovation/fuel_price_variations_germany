<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tankzeit | E10 in der Nähe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f6f4ef;
        --ink: #121212;
        --muted: #5f5f5f;
        --accent: #264653;
        --accent-2: #f4a261;
        --card: #ffffff;
        --shadow: 0 20px 50px rgba(10, 10, 10, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Manrope", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at top, #ffe8d6 0%, #f6f4ef 50%, #edf0f5 100%);
        min-height: 100vh;
      }
      .app {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .brand h1 {
        font-size: clamp(26px, 4vw, 40px);
        margin: 0 0 6px;
        letter-spacing: 0.04em;
      }
      .brand p {
        margin: 0;
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .btn {
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid transparent;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        color: var(--ink);
        background: #fff;
        box-shadow: 0 8px 20px rgba(10, 10, 10, 0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(10, 10, 10, 0.12);
      }
      .status {
        margin: 24px 0 18px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #fff8e7;
        color: #8a5b00;
        display: none;
      }
      .status.error {
        background: #ffe8e8;
        color: #8c1d1d;
      }
      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 20px;
        box-shadow: var(--shadow);
      }
      .table {
        width: 100%;
        border-collapse: collapse;
      }
      .table th, .table td {
        padding: 14px 10px;
        border-bottom: 1px solid #ececec;
        text-align: left;
        font-size: 0.95rem;
      }
      .table th {
        font-weight: 600;
        color: var(--muted);
      }
      .row-highlight {
        background: #eef7ff;
      }
      .fav {
        border: none;
        background: #f3f4f6;
        border-radius: 999px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .manual {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .manual input {
        border: 1px solid #d8d8d8;
        border-radius: 10px;
        padding: 8px 10px;
        min-width: 140px;
        font-family: inherit;
      }
      footer {
        margin-top: 28px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      @media (max-width: 700px) {
        .table th:nth-child(4),
        .table td:nth-child(4) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand">
          <h1>Tankzeit</h1>
          <p>E10 in der Nähe, sortiert nach Distanz.</p>
        </div>
        <div class="actions">
          <a class="btn" href="favoriten.html">Favoriten</a>
          <a class="btn primary" href="index.html">Diesel anzeigen</a>
        </div>
      </header>

      <div id="status" class="status"></div>

      <section class="card">
        <table class="table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Preis €/l</th>
              <th>Beste Zeiten</th>
              <th>Schwankung</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="stations">
            <tr><td colspan="5">Wir laden die Daten...</td></tr>
          </tbody>
        </table>
      </section>

      <footer>
        Daten via Tankerkönig. Gute Zeiten und Schwankung basieren auf den letzten Tagen.
      </footer>
    </main>

    <script>
      const DATA_BASE = "https://huggingface.co/datasets/loffenauer/fuel-prices-germany/resolve/main/data2/";
      const FUEL = "e10";

      const statusEl = document.getElementById("status");
      const stationsEl = document.getElementById("stations");
      const ids = JSON.parse(localStorage.getItem("ids")) || [];
      const fav = JSON.parse(localStorage.getItem("fav")) || [];

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `status ${type === "error" ? "error" : ""}`;
        statusEl.style.display = "block";
      }

      function clearStatus() {
        statusEl.style.display = "none";
      }

      function addAndStore(id, name, lat, lng) {
        if (!ids.includes(id)) {
          fav.push({ id, name, lat, lng });
          ids.push(id);
          localStorage.setItem("fav", JSON.stringify(fav));
          localStorage.setItem("ids", JSON.stringify(ids));
        }
      }

      function manualLocationForm() {
        const wrapper = document.createElement("div");
        wrapper.className = "manual";
        wrapper.innerHTML = `
          <input id="manual-lat" type="number" step="0.0001" placeholder="Breitengrad" />
          <input id="manual-lng" type="number" step="0.0001" placeholder="Laengengrad" />
          <button class="btn" id="manual-btn">Manuell suchen</button>
        `;
        statusEl.appendChild(wrapper);
        document.getElementById("manual-btn").onclick = () => {
          const lat = parseFloat(document.getElementById("manual-lat").value);
          const lng = parseFloat(document.getElementById("manual-lng").value);
          if (Number.isFinite(lat) && Number.isFinite(lng)) {
            loadStations(lat, lng);
          }
        };
      }

      function geoError(err) {
        let message = "Standort konnte nicht ermittelt werden.";
        if (err && err.code === 1) message = "Standortzugriff wurde verweigert.";
        if (err && err.code === 2) message = "Standort ist aktuell nicht verfuegbar.";
        if (err && err.code === 3) message = "Standortabfrage ist abgelaufen.";
        setStatus(`${message} Bitte manuell eingeben.`, "error");
        manualLocationForm();
      }

      function requestLocation() {
        if (!navigator.geolocation) {
          geoError({ code: 2 });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (position) => {
            loadStations(position.coords.latitude, position.coords.longitude);
          },
          geoError,
          { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 }
        );
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.json();
      }

      async function loadStations(lat, lng) {
        setStatus("Stationen werden geladen...");
        const url = `https://creativecommons.tankerkoenig.de/json/list.php?rad=10&type=all&sort=dist&lat=${lat}&lng=${lng}&apikey=fe8673d1-47be-1156-77e4-040e06cb785c`;
        try {
          const prices = await fetchJson(url);
          const stations = (prices.stations || []).filter((s) => s.isOpen && s[FUEL] != null);
          if (!stations.length) {
            stationsEl.innerHTML = "<tr><td colspan='5'>Keine offenen Stationen gefunden.</td></tr>";
            setStatus("Keine Stationen im Umkreis.");
            return;
          }
          const limited = stations.slice(0, 10);
          stationsEl.innerHTML = limited.map((s) => `
            <tr id="${s.id}">
              <td><a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" target="_blank" rel="noopener">${s.name} (${s.brand || ""})</a></td>
              <td>${s[FUEL]}</td>
              <td id="${s.id}-best">...</td>
              <td id="${s.id}-span">...</td>
              <td><button class="fav" data-id="${s.id}">Favorit</button></td>
            </tr>
          `).join("");

          document.querySelectorAll(".fav").forEach((btn) => {
            btn.addEventListener("click", () => {
              const station = limited.find((s) => s.id === btn.dataset.id);
              addAndStore(station.id, station.brand || station.name, station.lat, station.lng);
              btn.textContent = "Gespeichert";
            });
          });

          await Promise.allSettled(limited.map(async (s) => {
            const statsUrl = `${DATA_BASE}${s.id.split("-").join("/")}/${FUEL}.json`;
            const stats = await fetchJson(statsUrl);
            document.getElementById(`${s.id}-best`).textContent = stats.text || "-";
            document.getElementById(`${s.id}-span`).textContent = `${stats.minabs} - ${stats.maxabs} (± ${Math.round((stats.maxabs - stats.minabs) * 100)} ¢/l)`;

            const nowHour = new Date().getHours();
            if (stats.besthours && stats.besthours.includes(nowHour)) {
              const row = document.getElementById(s.id);
              row.classList.add("row-highlight");
            }
          }));

          clearStatus();
        } catch (err) {
          stationsEl.innerHTML = "<tr><td colspan='5'>Fehler beim Laden der Stationen.</td></tr>";
          setStatus("Fehler beim Laden der Daten. Bitte spaeter erneut versuchen.", "error");
        }
      }

      requestLocation();
    </script>
  </body>
</html>
